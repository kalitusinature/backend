databases:
  - name: kalitusi-db
    databaseName: kalitusi
    user: kalitusi
    plan: basic-256mb

services:
  - type: web
    name: kalitusi-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn kalitusi_backend.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: kalitusi_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kalitusi-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://kalitusi-nature-resort.odoo.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kalitusi-nature-resort.odoo.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
