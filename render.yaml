databases:
  - name: kalitusi-db
    databaseName: kalitusi
    user: kalitusi
    plan: basic-256mb

services:
  - type: web
    name: kalitusi-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn kalitusi_backend.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: kalitusi_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kalitusi-db
          property: connectionString
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESERVATION_NOTIFICATION_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ALLOWED_HOSTS
        value: api.kalitusi.com,kalitusi-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://admin.kalitusi.com,https://www.kalitusi.com,https://kalitusi-nature-resort.odoo.com,https://kalitusinature.github.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://admin.kalitusi.com,https://www.kalitusi.com,https://kalitusi-nature-resort.odoo.com,https://kalitusinature.github.io
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
