<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f6">
  <title>Request a cottage stay | Kalitusi Nature Resort</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17201f;
      background: #f4f7f6;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    a { color: inherit; }
    .site-header {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px max(24px, calc((100% - 1120px) / 2));
      border-bottom: 1px solid #e1e8e5;
      background: #fff;
    }
    .brand {
      color: #254537;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }
    .site-nav { display: flex; gap: 20px; }
    .site-nav a { color: #53645c; font-size: 14px; text-decoration: none; }
    .site-nav a:hover { color: #008b92; }
    .page { min-height: calc(100vh - 72px); padding: 42px 16px 76px; }
    .card {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid #e1e8e5;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(21, 35, 31, .08);
    }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 42px); letter-spacing: -1px; }
    .intro { margin: 0 0 28px; color: #5d6965; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin: 0 0 7px; font-size: 14px; font-weight: 700; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #d5dfda;
      border-radius: 7px;
      color: #17201f;
      background: #fff;
      font: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid #008b92;
      outline-offset: 1px;
    }
    .field textarea { min-height: 96px; resize: vertical; }
    .help { display: block; margin-top: 6px; color: #69736f; font-size: 12px; line-height: 1.45; }
    .submit {
      width: 100%;
      min-height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #008b92;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .submit:hover:not(:disabled) { background: #006f75; }
    .submit:disabled { background: #9daaa6; cursor: not-allowed; }
    .message { margin: 18px 0 0; padding: 13px 15px; border-radius: 7px; line-height: 1.5; }
    .message[hidden] { display: none; }
    .message[data-state="error"] { color: #9e271d; background: #fff0ee; }
    .message[data-state="success"] { color: #17633a; background: #eaf7ef; }
    .back-link { display: inline-block; margin-top: 20px; color: #007a80; font-weight: 700; text-decoration: none; }
    @media (max-width: 620px) {
      .site-header { min-height: 62px; padding: 12px 16px; }
      .brand { font-size: 17px; }
      .site-nav { gap: 12px; }
      .site-nav a { font-size: 12px; }
      .page { padding: 24px 12px 56px; }
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://kalitusi-nature-resort.odoo.com/">Kalitusi Nature Resort</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="https://kalitusi-nature-resort.odoo.com/cottages">Cottages</a>
      <a href="https://kalitusi-nature-resort.odoo.com/contactus">Contact</a>
    </nav>
  </header>
  <main class="page">
    <section class="card" aria-labelledby="reservation-title">
      <h1 id="reservation-title">Request a cottage stay</h1>
      <p class="intro">Send us your preferred dates and guest details. Your request will be reviewed by our team; your stay is not confirmed until staff contacts you.</p>
      <form id="reservation-form">
        <div class="grid">
          <div class="field full">
            <label for="lodge">Cottage or lodge</label>
            <select id="lodge" name="lodge" required>
              <option value="">Loading available stays…</option>
            </select>
            <small class="help" id="lodge-help">Choose your preferred stay.</small>
          </div>
          <div class="field">
            <label for="check-in">Check-in</label>
            <input id="check-in" name="check_in" type="date" required>
          </div>
          <div class="field">
            <label for="check-out">Check-out</label>
            <input id="check-out" name="check_out" type="date" required>
          </div>
          <div class="field">
            <label for="guest-name">Full name</label>
            <input id="guest-name" name="guest_name" type="text" maxlength="120" autocomplete="name" required placeholder="Your name">
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel" required placeholder="+256 700 000 000">
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="adults">Adults</label>
            <input id="adults" name="adults" type="number" min="1" max="50" value="1" required>
          </div>
          <div class="field">
            <label for="children">Children</label>
            <input id="children" name="children" type="number" min="0" max="50" value="0" required>
          </div>
          <div class="field full">
            <label for="occasion">Occasion (optional)</label>
            <input id="occasion" name="occasion" type="text" maxlength="100" placeholder="Birthday, anniversary, or other occasion">
          </div>
          <div class="field full">
            <label for="note">Additional note (optional)</label>
            <textarea id="note" name="note" maxlength="2000" placeholder="Tell us about any requests for your stay."></textarea>
          </div>
        </div>
        <button class="submit" id="submit" type="submit" disabled>Send reservation request</button>
        <div class="message" id="message" role="status" aria-live="polite" hidden></div>
      </form>
      <a class="back-link" href="https://kalitusi-nature-resort.odoo.com/cottages">Back to cottages</a>
    </section>
  </main>
  <script>
    (function () {
      var apiBase = (window.CJ_API_BASE_URL || window.location.origin + '/api/v1').replace(/\/+$/, '');
      var form = document.getElementById('reservation-form');
      var lodgeSelect = document.getElementById('lodge');
      var lodgeHelp = document.getElementById('lodge-help');
      var checkIn = document.getElementById('check-in');
      var checkOut = document.getElementById('check-out');
      var adultsInput = document.getElementById('adults');
      var childrenInput = document.getElementById('children');
      var submitButton = document.getElementById('submit');
      var message = document.getElementById('message');
      var lodges = [];
      var requestedSlug = new URLSearchParams(window.location.search).get('lodge') || '';

      function localDateValue(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }

      function nextDate(value) {
        var date = new Date(value + 'T12:00:00');
        date.setDate(date.getDate() + 1);
        return localDateValue(date);
      }

      var today = localDateValue(new Date());
      checkIn.min = today;
      checkOut.min = today;

      function showMessage(state, text) {
        message.dataset.state = state;
        message.textContent = text;
        message.hidden = false;
      }

      function hideMessage() {
        message.textContent = '';
        message.hidden = true;
        delete message.dataset.state;
      }

      function errorText(data, status) {
        if (data && typeof data.detail === 'string') return data.detail;
        if (data && typeof data === 'object') {
          var parts = Object.keys(data).map(function (key) {
            var value = data[key];
            return key + ': ' + (Array.isArray(value) ? value.join(' ') : typeof value === 'string' ? value : JSON.stringify(value));
          });
          if (parts.length) return parts.join(' ');
        }
        return 'The reservation service returned HTTP ' + status + '. Please try again.';
      }

      function loadLodges(preserveMessage) {
        var selectedSlug = lodgeSelect.value || requestedSlug;
        var query = new URLSearchParams();
        if (checkIn.value && checkOut.value && checkOut.value > checkIn.value) {
          query.set('check_in', checkIn.value);
          query.set('check_out', checkOut.value);
          query.set('guests', String(Number(adultsInput.value || 1) + Number(childrenInput.value || 0)));
        }
        var url = apiBase + '/lodges/' + (query.toString() ? '?' + query.toString() : '');
        lodgeSelect.disabled = true;
        submitButton.disabled = true;
        lodgeSelect.replaceChildren(new Option('Loading available stays…', ''));
        fetch(url, { headers: { Accept: 'application/json' } })
          .then(function (response) {
            return response.text().then(function (text) {
              var data = null;
              try { data = text ? JSON.parse(text) : null; } catch (parseError) {}
              if (!response.ok) throw new Error(errorText(data, response.status));
              if (!Array.isArray(data)) throw new Error('The resort returned an invalid cottage list.');
              return data;
            });
          })
          .then(function (data) {
            lodges = data;
            lodgeSelect.replaceChildren(new Option(data.length ? 'Choose a cottage or lodge' : 'No stays currently available', ''));
            data.forEach(function (lodge) {
              lodgeSelect.add(new Option(lodge.name + ' · sleeps ' + lodge.capacity, lodge.slug));
            });
            var matchingLodge = data.find(function (lodge) { return lodge.slug === selectedSlug; });
            if (matchingLodge) lodgeSelect.value = matchingLodge.slug;
            lodgeSelect.disabled = data.length === 0;
            submitButton.disabled = data.length === 0;
            if (!data.length) {
              lodgeHelp.textContent = query.toString()
                ? 'No active stays are available for those dates. Try different dates.'
                : 'No active cottages are listed yet. Please contact the resort.';
            } else {
              lodgeHelp.textContent = matchingLodge
                ? 'Your selected cottage is ready.'
                : 'Choose an active cottage or lodge from the list.';
              if (selectedSlug && !matchingLodge) {
                showMessage('error', 'That cottage is not currently listed as available. Please choose another stay.');
              } else if (!preserveMessage) {
                hideMessage();
              }
            }
            requestedSlug = '';
          })
          .catch(function (error) {
            lodges = [];
            lodgeSelect.replaceChildren(new Option('Could not load stays', ''));
            lodgeSelect.disabled = true;
            submitButton.disabled = true;
            lodgeHelp.textContent = 'Please check your connection and reload this page.';
            showMessage('error', error.message || 'Could not load cottages. Please try again.');
          });
      }

      checkIn.addEventListener('change', function () {
        checkOut.min = checkIn.value ? nextDate(checkIn.value) : today;
        if (checkOut.value && !(checkOut.value > checkIn.value)) checkOut.value = '';
        hideMessage();
        loadLodges();
      });
      checkOut.addEventListener('change', function () {
        hideMessage();
        loadLodges();
      });
      adultsInput.addEventListener('change', function () { loadLodges(); });
      childrenInput.addEventListener('change', function () { loadLodges(); });
      lodgeSelect.addEventListener('change', hideMessage);

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.reportValidity()) return;
        var formData = new FormData(form);
        var selectedLodge = lodges.find(function (lodge) {
          return lodge.slug === String(formData.get('lodge') || '');
        });
        if (!selectedLodge) {
          showMessage('error', 'Choose an available cottage or lodge before submitting.');
          return;
        }
        var adults = Number(formData.get('adults'));
        var children = Number(formData.get('children'));
        if (adults + children > selectedLodge.capacity) {
          showMessage('error', 'This stay allows up to ' + selectedLodge.capacity + ' guests. Adjust the guest count or choose another stay.');
          return;
        }
        var payload = {
          lodge: selectedLodge.slug,
          guest_name: String(formData.get('guest_name') || '').trim(),
          phone: String(formData.get('phone') || '').trim(),
          email: String(formData.get('email') || '').trim(),
          check_in: String(formData.get('check_in') || ''),
          check_out: String(formData.get('check_out') || ''),
          adults: adults,
          children: children,
          occasion: String(formData.get('occasion') || '').trim(),
          note: String(formData.get('note') || '').trim()
        };
        submitButton.disabled = true;
        submitButton.textContent = 'Sending request…';
        hideMessage();
        fetch(apiBase + '/reservations/', {
          method: 'POST',
          headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.text().then(function (text) {
              var data = null;
              try { data = text ? JSON.parse(text) : null; } catch (parseError) {}
              if (!response.ok) throw new Error(errorText(data, response.status));
              if (!data || !data.reference) throw new Error('The resort returned an invalid reservation receipt.');
              return data;
            });
          })
          .then(function (receipt) {
            form.reset();
            checkIn.min = today;
            checkOut.min = today;
            requestedSlug = '';
            showMessage('success', 'Request ' + receipt.reference + ' received for ' + receipt.lodge_name + ' (' + receipt.check_in + ' to ' + receipt.check_out + '). Status: ' + (receipt.status_label || 'Pending review') + '. The resort will contact you to confirm.');
            loadLodges(true);
          })
          .catch(function (error) {
            showMessage('error', error.message || 'Could not send your reservation request. Please try again.');
          })
          .finally(function () {
            submitButton.textContent = 'Send reservation request';
            submitButton.disabled = lodges.length === 0;
          });
      });

      loadLodges();
    })();
  </script>
</body>
</html>
