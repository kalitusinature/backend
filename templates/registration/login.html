<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff sign in | Kalitusi Resort</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#172321;font-family:Arial,sans-serif}
        .card{width:min(420px,calc(100% - 32px));margin:10vh auto;background:#fff;padding:32px;border:1px solid #e1e9e6;border-radius:8px;box-shadow:0 16px 42px rgba(0,0,0,.08)}
        h1{font-size:25px;margin:0 0 8px}.hint{color:#66716f;margin:0 0 24px}
        label{display:block;font-weight:700;font-size:13px;margin:16px 0 7px}
        input{width:100%;padding:12px;border:1px solid #cfd9d5;border-radius:5px;font-size:15px}
        button{margin-top:22px;width:100%;height:46px;background:#008b92;color:#fff;border:0;border-radius:4px;font-weight:800;font-size:15px;cursor:pointer}
        .error{background:#fff1f0;color:#9e2119;padding:10px;border-radius:4px;font-size:14px}
    </style>
</head>
<body>
    <main class="card">
        <h1>Staff portal</h1>
        <p class="hint">Sign in to manage orders, menu items, and lodge reservations.</p>
        {% if form.errors %}<p class="error">The username or password was not accepted.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}"/>
            <label for="id_username">Username</label>
            <input id="id_username" name="username" autocomplete="username" required autofocus/>
            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required/>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
