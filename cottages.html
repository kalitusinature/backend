<t t-name="website.cottages">
    <t t-call="website.layout">
        <div id="wrap" class="oe_structure oe_empty">
            <style>
                .cj-cottages-page{font-family:Arial,Helvetica,sans-serif;background:#f4f7f6;color:#17201f;min-height:75vh}
                .cj-cottages-container{width:min(1180px,calc(100% - 32px));margin:42px auto 80px}
                .cj-cottages-heading{text-align:center;margin:0 auto 30px;max-width:720px}
                .cj-cottages-heading h1{font-size:clamp(32px,5vw,46px);letter-spacing:-1px;margin:0 0 12px}
                .cj-cottages-heading p{color:#5d6965;line-height:1.6;margin:0}
                .cj-cottages-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
                .cj-cottage-card{overflow:hidden;background:#fff;border:1px solid #e1e8e5;border-radius:12px;box-shadow:0 12px 30px rgba(21,35,31,.07);display:flex;flex-direction:column}
                .cj-cottage-photo{height:220px;background:#e8efec;display:grid;place-items:center;overflow:hidden;color:#62716a;font-size:14px}
                .cj-cottage-photo img{width:100%;height:100%;object-fit:cover}
                .cj-cottage-body{padding:22px;display:flex;flex:1;flex-direction:column;align-items:flex-start}
                .cj-cottage-body h2{font-size:22px;margin:0 0 10px}
                .cj-cottage-description{color:#5d6965;line-height:1.6;margin:0 0 14px;white-space:pre-line}
                .cj-cottage-capacity{font-size:14px;font-weight:700;color:#35433e;margin:0 0 20px}
                .cj-cottage-policy{font-size:13px;color:#5d6965;margin:-10px 0 20px}
                .cj-cottage-book{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:auto;padding:0 20px;border-radius:7px;background:#008b92;color:#fff;text-decoration:none;font-weight:800}
                .cj-cottage-book:hover{background:#006f75;color:#fff}
                .cj-cottages-status{margin:0 auto 22px;max-width:720px;text-align:center;color:#5d6965;line-height:1.6}
                .cj-cottages-status[data-state="error"]{color:#9e271d}
                .cj-cottages-empty{grid-column:1/-1;padding:34px 22px;text-align:center;border:1px dashed #b9c8c1;border-radius:10px;background:#fff;color:#5d6965;line-height:1.6}
                .cj-cottages-empty p{margin:0}
                .cj-loading-screen{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 30%,rgba(224,241,239,.9),transparent 58%),rgba(247,250,249,.98);backdrop-filter:blur(8px);font-family:Arial,Helvetica,sans-serif}
                .cj-loading-screen.is-hidden{display:none}
                .cj-loading-card{display:grid;width:min(440px,100%);justify-items:center;padding:38px 30px 30px;border:1px solid #dfeae7;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(17,54,49,.12);text-align:center}
                .cj-loading-mark{display:grid;width:56px;height:56px;place-items:center;border:1px solid #d8e9e5;border-radius:17px;color:#fff;background:linear-gradient(145deg,#00999a,#12605d);box-shadow:0 8px 18px rgba(0,139,146,.18);font-family:Georgia,serif;font-size:30px;font-weight:700}
                .cj-loading-eyebrow{margin-top:15px;color:#947251;font-size:9px;font-weight:750;letter-spacing:2px}
                .cj-loading-spinner{width:34px;height:34px;margin-top:27px;border:3px solid #e4eee9;border-top-color:#008b92;border-right-color:#c89b56;border-radius:50%;animation:cjLoadingSpin .85s linear infinite}
                .cj-loading-card h2{margin:21px 0 0;color:#203b38;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500;letter-spacing:-.4px}
                .cj-loading-message{margin:8px 0 0;color:#687b75;font-size:12px}
                .cj-loading-track{width:min(260px,100%);height:4px;overflow:hidden;margin-top:23px;border-radius:99px;background:#e9efec}
                .cj-loading-track span{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#008b92,#c89b56);animation:cjLoadingProgress 1.5s ease-in-out infinite}
                @keyframes cjLoadingSpin{to{transform:rotate(360deg)}}
                @keyframes cjLoadingProgress{0%{transform:translateX(-120%)}50%{transform:translateX(150%)}100%{transform:translateX(320%)}}
                @media(max-width:540px){.cj-loading-card{padding:30px 21px 25px}.cj-loading-card h2{font-size:21px}}
                @media(prefers-reduced-motion:reduce){.cj-loading-spinner,.cj-loading-track span{animation:none}.cj-loading-track span{width:100%}}
                @media(max-width:580px){.cj-cottages-container{width:calc(100% - 24px);margin:26px auto 56px}.cj-cottages-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cj-cottage-photo{height:170px}.cj-cottage-body{padding:14px}.cj-cottage-body h2{font-size:17px}.cj-cottage-description{font-size:13px}.cj-cottage-capacity,.cj-cottage-policy{font-size:12px}.cj-cottage-book{width:100%;padding:0 10px;font-size:13px}}
            </style>
            <main class="cj-cottages-page">
                <t t-call="website.cj_header"/>
                <section class="cj-cottages-container">
                    <header class="cj-cottages-heading">
                        <h1>Our Cottages and Lodges</h1>
                        <p>Explore available stays, view their details, and send a reservation request.</p>
                    </header>
                    <p class="cj-cottages-status" id="cjCottagesStatus" role="status" aria-live="polite">Loading available stays…</p>
                    <div class="cj-cottages-grid" id="cjCottagesGrid"></div>
                </section>
            </main>
            <script>
                (function(){
                    if(!document.getElementById('cjLoadingScreen')){
                        var loader=document.createElement('div');
                        loader.id='cjLoadingScreen';
                        loader.className='cj-loading-screen';
                        loader.setAttribute('role','status');
                        loader.setAttribute('aria-live','polite');
                        loader.setAttribute('aria-busy','true');
                        loader.innerHTML='<div class="cj-loading-card"><span class="cj-loading-mark" aria-hidden="true">K</span><span class="cj-loading-eyebrow">KALITUSI NATURE RESORT</span><span class="cj-loading-spinner" aria-hidden="true"></span><h2>Getting things ready</h2><p class="cj-loading-message">Loading cottages and lodges…</p><div class="cj-loading-track" aria-hidden="true"><span></span></div></div>';
                        document.body.appendChild(loader);
                    }else{
                        var loader=document.getElementById('cjLoadingScreen');
                    }
                    var startedAt=Date.now();
                    var hideTimer=null;
                    function hideLoader(){
                        if(hideTimer)window.clearTimeout(hideTimer);
                        var delay=Math.max(180,700-(Date.now()-startedAt));
                        hideTimer=window.setTimeout(function(){
                            loader.classList.add('is-hidden');
                            loader.setAttribute('aria-busy','false');
                        },delay);
                    }
                    var apiBase=(window.CJ_API_BASE_URL||'https://backend-bte7.onrender.com/api/v1').replace(/\/+$/,'');
                    var reservationBase=(window.CJ_RESERVATION_BASE_URL||apiBase.replace(/\/api\/v1$/,'')).replace(/\/+$/,'');
                    var grid=document.getElementById('cjCottagesGrid');
                    var status=document.getElementById('cjCottagesStatus');
                    function showStatus(state,text){
                        status.dataset.state=state;
                        status.textContent=text;
                        status.hidden=false;
                    }
                    function addEmptyState(text){
                        var empty=document.createElement('div');
                        empty.className='cj-cottages-empty';
                        var paragraph=document.createElement('p');
                        paragraph.textContent=text;
                        empty.appendChild(paragraph);
                        grid.appendChild(empty);
                    }
                    function createCard(lodge){
                        var card=document.createElement('article');
                        card.className='cj-cottage-card';
                        var photo=document.createElement('div');
                        photo.className='cj-cottage-photo';
                        if(lodge.image_url){
                            var image=document.createElement('img');
                            image.src=lodge.image_url;
                            image.alt=lodge.name+' cottage';
                            image.loading='lazy';
                            image.addEventListener('error',function(){
                                photo.replaceChildren();
                                photo.textContent='Photo unavailable';
                            },{once:true});
                            photo.appendChild(image);
                        }else{
                            photo.textContent='Photo coming soon';
                        }
                        var body=document.createElement('div');
                        body.className='cj-cottage-body';
                        var heading=document.createElement('h2');
                        heading.textContent=lodge.name;
                        body.appendChild(heading);
                        if(lodge.description){
                            var description=document.createElement('p');
                            description.className='cj-cottage-description';
                            description.textContent=lodge.description;
                            body.appendChild(description);
                        }
                        var capacity=document.createElement('p');
                        capacity.className='cj-cottage-capacity';
                        capacity.textContent='Sleeps up to '+lodge.capacity+' guest'+(lodge.capacity===1?'':'s');
                        body.appendChild(capacity);
                        var policy=document.createElement('p');
                        policy.className='cj-cottage-policy';
                        policy.textContent='Minimum stay: '+lodge.min_nights+' night'+(lodge.min_nights===1?'':'s');
                        body.appendChild(policy);
                        var bookingLink=document.createElement('a');
                        bookingLink.className='cj-cottage-book';
                        bookingLink.textContent='Book Now';
                        bookingLink.href=reservationBase+'/reservation/?lodge='+encodeURIComponent(lodge.slug);
                        body.appendChild(bookingLink);
                        card.appendChild(photo);
                        card.appendChild(body);
                        return card;
                    }
                    fetch(apiBase+'/lodges/',{headers:{Accept:'application/json'}}).then(function(response){
                        return response.text().then(function(text){
                            var data=null;
                            try{data=text?JSON.parse(text):null;}catch(parseError){}
                            if(!response.ok){
                                var detail=data&&typeof data.detail==='string'?data.detail:'HTTP '+response.status;
                                throw new Error('Could not load cottages: '+detail);
                            }
                            if(!Array.isArray(data))throw new Error('The resort returned an invalid cottage list.');
                            return data;
                        });
                    }).then(function(lodges){
                        status.hidden=true;
                        grid.replaceChildren();
                        if(!lodges.length){
                            addEmptyState('No cottages or lodges are currently available. Please check back later.');
                            hideLoader();
                            return;
                        }
                        lodges.forEach(function(lodge){
                            grid.appendChild(createCard(lodge));
                        });
                        hideLoader();
                    }).catch(function(error){
                        grid.replaceChildren();
                        showStatus('error',error.message||'Could not load cottages. Please refresh and try again.');
                        hideLoader();
                    });
                })();
            </script>
        </div>
    </t>
</t>
