        <script>
            (function(){
                var loader=document.getElementById('cjLoadingScreen');
                var startedAt=Date.now();
                var pageReady=document.readyState==='complete';
                var pendingRequests=0;
                var showTimer=null;
                var hideTimer=null;
                var visible=true;
                function setVisible(next){
                    if(!loader||visible===next)return;
                    visible=next;
                    if(next){
                        loader.classList.remove('is-hidden');
                        loader.setAttribute('aria-busy','true');
                    }else{
                        loader.classList.add('is-hidden');
                        loader.setAttribute('aria-busy','false');
                    }
                }
                function scheduleHide(){
                    if(!pageReady||pendingRequests>0)return;
                    if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                    if(hideTimer)window.clearTimeout(hideTimer);
                    var minimumVisible=Math.max(0,700-(Date.now()-startedAt));
                    hideTimer=window.setTimeout(function(){
                        if(pageReady&amp;&amp;pendingRequests===0)setVisible(false);
                    },Math.max(minimumVisible,180));
                }
                function beginRequest(){
                    pendingRequests++;
                    if(hideTimer){window.clearTimeout(hideTimer);hideTimer=null;}
                    if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                    if(!visible){
                        showTimer=window.setTimeout(function(){setVisible(true);},150);
                    }
                }
                function endRequest(){
                    pendingRequests=Math.max(0,pendingRequests-1);
                    if(pendingRequests===0)scheduleHide();
                }
                function markPageReady(){
                    pageReady=true;
                    scheduleHide();
                }
                if(pageReady)markPageReady();
                else window.addEventListener('load',markPageReady,{once:true});
                if(window.fetch&amp;&amp;!window.CJFetchLoadingWrapped){
                    window.CJFetchLoadingWrapped=true;
                    var originalFetch=window.fetch;
                    window.fetch=function(input,options){
                        var url=typeof input==='string'?input:(input&amp;&amp;input.url)||'';
                        if(url.indexOf('/api/v1/')===-1||url.indexOf('/cart/')!==-1)return originalFetch.apply(this,arguments);
                        beginRequest();
                        var complete=false;
                        function finish(){
                            if(complete)return;
                            complete=true;
                            endRequest();
                        }
                        return originalFetch.apply(this,arguments).then(function(response){
                            finish();
                            return response;
                        },function(error){
                            finish();
                            throw error;
                        });
                    };
                }
                document.addEventListener('click',function(event){
                    if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
                    var link=event.target;
                    while(link&amp;&amp;link.tagName!=='A')link=link.parentNode;
                    if(!link||link.target==='_blank'||link.hasAttribute('download'))return;
                    if(link.hostname===window.location.hostname&amp;&amp;link.pathname!==window.location.pathname){
                        beginRequest();
                    }
                },true);
            })();
        </script>

        <script>
            (function(){
                var apiBase=window.CJ_API_BASE_URL||'https://backend-bte7.onrender.com/api/v1';
                var tokenKey='cjCartToken';
                var tokenPromise=null;
                window.CJ_API_BASE_URL=apiBase;
                var badge=document.getElementById('cjCartCount');
                var link=document.querySelector('.cj-default-cart-link');
                function updateCartCount(cart,failed){
                    if(!badge)return;
                    var count=failed?null:Number(cart&amp;&amp;cart.item_count)||0;
                    badge.textContent=failed?'!':String(count);
                    badge.title=failed?'Cart count unavailable':count+' item'+(count===1?'':'s');
                    badge.setAttribute('aria-label',failed?'Cart count unavailable':count+' item'+(count===1?'':'s'));
                    if(link)link.setAttribute('aria-label',failed?'Shopping cart; count unavailable':'Shopping cart, '+count+' item'+(count===1?'':'s'));
                }
                function parseResponse(response){
                    return response.text().then(function(text){
                        var data=null;
                        try{data=text?JSON.parse(text):null;}catch(error){}
                        if(!response.ok){
                            var detail=data&amp;&amp;(data.detail||data.quantity||data.cart_token);
                            throw new Error(typeof detail==='string'?detail:'Cart service returned HTTP '+response.status+'.');
                        }
                        if(!data||typeof data!=='object')throw new Error('Cart service returned invalid data.');
                        return data;
                    });
                }
                function getToken(createIfMissing){
                    var token,legacyItems=[];
                    try{
                        token=localStorage.getItem(tokenKey);
                        if(!token){
                            var legacyCart=[];
                            try{legacyCart=JSON.parse(localStorage.getItem('cjCart')||'[]');}catch(parseError){
                                if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to read the existing cart for migration:',parseError);
                            }
                            if(Array.isArray(legacyCart)){
                                legacyItems=legacyCart.map(function(item){
                                    var quantity=Number(item&amp;&amp;item.qty)||1;
                                    return {
                                        product:String(item&amp;&amp;(item.slug||item.id)||''),
                                        quantity:Math.min(99,Math.max(1,Math.floor(quantity)))
                                    };
                                }).filter(function(item){return Boolean(item.product);});
                            }
                        }
                    }catch(error){return Promise.reject(new Error('Browser storage is unavailable for your cart.'));}
                    if(token)return Promise.resolve(token);
                    if(tokenPromise)return tokenPromise;
                    if(!createIfMissing&amp;&amp;!legacyItems.length)return Promise.resolve(null);
                    var createOptions={method:'POST',headers:{Accept:'application/json'}};
                    if(legacyItems.length){
                        createOptions.headers['Content-Type']='application/json';
                        createOptions.body=JSON.stringify({items:legacyItems});
                    }
                    tokenPromise=window.fetch(apiBase+'/cart/create/',createOptions).then(parseResponse).then(function(data){
                        if(typeof data.token!=='string'||!data.token)throw new Error('Cart service did not return a cart token.');
                        try{
                            localStorage.setItem(tokenKey,data.token);
                            if(legacyItems.length)localStorage.removeItem('cjCart');
                        }catch(error){throw new Error('Browser storage is unavailable for your cart.');}
                        return data.token;
                    }).then(function(value){
                        tokenPromise=null;
                        return value;
                    },function(error){
                        tokenPromise=null;
                        throw error;
                    });
                    return tokenPromise;
                }
                function request(path,options){
                    options=options||{};
                    var createCart=options.createCart===true;
                    delete options.createCart;
                    return getToken(createCart).then(function(token){
                        if(!token){
                            var emptyCart={items:[],item_count:0,subtotal_ugx:0};
                            updateCartCount(emptyCart,false);
                            return emptyCart;
                        }
                        var headers=options.headers||{};
                        headers.Accept='application/json';
                        headers.Authorization='Bearer '+token;
                        if(options.body)headers['Content-Type']='application/json';
                        options.headers=headers;
                        return window.fetch(apiBase+path,options).then(parseResponse);
                    }).then(function(cart){
                        updateCartCount(cart,false);
                        window.dispatchEvent(new CustomEvent('cjCartUpdated',{detail:{cart:cart,path:path,method:options.method||'GET'}}));
                        try{localStorage.setItem('cjCartUpdatedAt',String(Date.now()));}catch(error){}
                        return cart;
                    });
                }
                window.CJCart={
                    token:getToken,
                    get:function(){return request('/cart/',{method:'GET'});},
                    refresh:function(){return request('/cart/',{method:'GET'});},
                    add:function(product,quantity){
                        return request('/cart/items/',{method:'POST',createCart:true,body:JSON.stringify({product:product,quantity:quantity})});
                    },
                    setQuantity:function(product,quantity){
                        return request('/cart/items/'+encodeURIComponent(product)+'/',{method:'PATCH',body:JSON.stringify({quantity:quantity})});
                    },
                    remove:function(product){
                        return request('/cart/items/'+encodeURIComponent(product)+'/',{method:'DELETE'});
                    },
                    clear:function(){return request('/cart/',{method:'DELETE'});}
                };
                window.CJCart.refresh().catch(function(error){
                    updateCartCount(null,true);
                    if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to load cart count:',error);
                });
                window.addEventListener('storage',function(event){
                    if(!event.key||event.key===tokenKey||event.key==='cjCartUpdatedAt'){
                        window.CJCart.refresh().catch(function(error){
                            updateCartCount(null,true);
                            if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to refresh cart count:',error);
                        });
                    }
                });
            })();
        </script>

        <script>
            (function(){
                var root=document.getElementById('cjFloatingCart');
                var trigger=document.getElementById('cjFloatingCartTrigger');
                var panel=document.getElementById('cjFloatingCartPanel');
                var itemsNode=document.getElementById('cjFloatingCartItems');
                var countNode=document.getElementById('cjFloatingCartCount');
                var currentItems=[];
                function escapeHtml(value){
                    return String(value==null?'':value).replace(/[&amp;&lt;&gt;"']/g,function(character){
                        return {'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','"':'&amp;quot;',"'":'&amp;#39;'}[character];
                    });
                }
                function formatMoney(value){return 'UGX '+Number(value||0).toLocaleString('en-UG');}
                function localCart(){
                    var legacy=[];
                    try{legacy=JSON.parse(localStorage.getItem('cjCart')||'[]');}catch(error){}
                    var items=Array.isArray(legacy)?legacy.map(function(item){
                        return {product:String(item&amp;&amp;(item.slug||item.id)||''),name:item&amp;&amp;item.name||'',price:Number(item&amp;&amp;item.price)||0,image:item&amp;&amp;item.image||'',quantity:Number(item&amp;&amp;item.qty)||1};
                    }):[];
                    items=items.filter(function(item){return Boolean(item.product);});
                    return {
                        items:items,
                        item_count:items.reduce(function(total,item){return total+item.quantity;},0),
                        subtotal_ugx:items.reduce(function(total,item){return total+item.price*item.quantity;},0)
                    };
                }
                function render(cart){
                    cart=cart||{items:[],item_count:0,subtotal_ugx:0};
                    currentItems=cart.items||[];
                    var count=Number(cart.item_count)||0;
                    var subtotal=Number(cart.subtotal_ugx)||0;
                    var countText=count+' item'+(count===1?'':'s');
                    countNode.textContent=String(count);
                    document.getElementById('cjFloatingCartItemCount').textContent=countText;
                    document.getElementById('cjFloatingCartSubtotal').textContent=formatMoney(subtotal);
                    trigger.setAttribute('aria-label','Open shopping cart, '+countText+', '+formatMoney(subtotal));
                    document.getElementById('cjFloatingCartCheckout').hidden=count===0;
                    if(!currentItems.length){
                        itemsNode.innerHTML='&lt;p class="cj-floating-cart-message">Your cart is empty. &lt;a href="/menu">Browse the menu&lt;/a>&lt;/p>';
                        return;
                    }
                    itemsNode.innerHTML=currentItems.map(function(item){
                        var image='';
                        if(item.image){
                            try{
                                var imageUrl=new URL(item.image,window.CJ_API_BASE_URL||window.location.href);
                                if(imageUrl.protocol==='https:'||imageUrl.protocol==='http:')image='&lt;img class="cj-floating-cart-item-image" src="'+escapeHtml(imageUrl.href)+'" alt=""/>';
                            }catch(error){}
                        }
                        var lineTotal=Number(item.price)*Number(item.quantity);
                        return '&lt;article class="cj-floating-cart-item">'+(image||'&lt;span class="cj-floating-cart-item-image" aria-hidden="true">&lt;/span>')+'&lt;div>&lt;span class="cj-floating-cart-item-name">'+escapeHtml(item.name)+'&lt;/span>&lt;span class="cj-floating-cart-item-price">'+formatMoney(item.price)+' each&lt;/span>&lt;span class="cj-floating-cart-item-total">'+formatMoney(lineTotal)+'&lt;/span>&lt;/div>&lt;div class="cj-floating-cart-controls">&lt;button class="cj-floating-cart-qty-button" type="button" data-action="minus" data-product="'+escapeHtml(item.product)+'" aria-label="Decrease '+escapeHtml(item.name)+' quantity">−&lt;/button>&lt;span class="cj-floating-cart-qty">'+item.quantity+'&lt;/span>&lt;button class="cj-floating-cart-qty-button" type="button" data-action="plus" data-product="'+escapeHtml(item.product)+'" aria-label="Increase '+escapeHtml(item.name)+' quantity" '+(Number(item.quantity)>=99?'disabled':'')+'>+&lt;/button>&lt;button class="cj-floating-cart-remove" type="button" data-action="remove" data-product="'+escapeHtml(item.product)+'" aria-label="Remove '+escapeHtml(item.name)+'">×&lt;/button>&lt;/div>&lt;/article>';
                    }).join('');
                }
                function loadCart(){
                    if(window.CJCart)window.CJCart.get().then(render).catch(function(error){
                        itemsNode.innerHTML='&lt;p class="cj-floating-cart-message">'+escapeHtml(error.message||'Unable to load your cart.')+' &lt;button type="button" id="cjFloatingCartRetry">Retry&lt;/button>&lt;/p>';
                    });
                    else render(localCart());
                }
                function setOpen(open){
                    panel.hidden=!open;
                    trigger.setAttribute('aria-expanded',String(open));
                    if(open)loadCart();
                }
                trigger.addEventListener('click',function(){setOpen(panel.hidden);});
                document.getElementById('cjFloatingCartClose').addEventListener('click',function(){setOpen(false);trigger.focus();});
                document.addEventListener('click',function(event){
                    if(!panel.hidden&amp;&amp;!root.contains(event.target))setOpen(false);
                });
                document.addEventListener('keydown',function(event){
                    if(event.key==='Escape'&amp;&amp;!panel.hidden){setOpen(false);trigger.focus();}
                });
                itemsNode.addEventListener('click',function(event){
                    if(event.target.closest('#cjFloatingCartRetry')){loadCart();return;}
                    var button=event.target.closest('button[data-action]');
                    if(!button)return;
                    var item=currentItems.find(function(entry){return entry.product===button.dataset.product;});
                    if(!item)return;
                    button.disabled=true;
                    if(window.CJCart){
                        var operation=button.dataset.action==='remove'
                            ?window.CJCart.remove(item.product)
                            :window.CJCart.setQuantity(item.product,item.quantity+(button.dataset.action==='plus'?1:-1));
                        operation.then(render).catch(function(error){
                            itemsNode.innerHTML='&lt;p class="cj-floating-cart-message">'+escapeHtml(error.message||'Unable to update your cart.')+' &lt;button type="button" id="cjFloatingCartRetry">Retry&lt;/button>&lt;/p>';
                        });
                        return;
                    }
                    var local=localCart(),localItem=local.items.find(function(entry){return entry.product===item.product;});
                    if(!localItem)return;
                    if(button.dataset.action==='remove'||(button.dataset.action==='minus'&amp;&amp;localItem.quantity&lt;=1)){
                        local.items=local.items.filter(function(entry){return entry.product!==item.product;});
                    }else{
                        localItem.quantity=Math.min(99,localItem.quantity+(button.dataset.action==='plus'?1:-1));
                    }
                    local.item_count=local.items.reduce(function(total,entry){return total+entry.quantity;},0);
                    local.subtotal_ugx=local.items.reduce(function(total,entry){return total+entry.price*entry.quantity;},0);
                    try{
                        localStorage.setItem('cjCart',JSON.stringify(local.items.map(function(entry){return {id:entry.product,name:entry.name,price:entry.price,image:entry.image,qty:entry.quantity};})));
                        render(local);
                    }catch(error){
                        itemsNode.innerHTML='&lt;p class="cj-floating-cart-message">Unable to save your cart. Please check browser storage.&lt;/p>';
                    }
                });
                window.addEventListener('cjCartUpdated',function(event){
                    var detail=event.detail||{};
                    render(detail.cart||detail);
                    if(detail.method==='POST'&amp;&amp;detail.path==='/cart/items/'){
                        countNode.classList.remove('is-pulsing');
                        void countNode.offsetWidth;
                        countNode.classList.add('is-pulsing');
                    }
                });
                loadCart();
                if(window.location.protocol==='file:'){
                    document.querySelectorAll('.cj-floating-cart a[href]').forEach(function(link){
                        var href=link.getAttribute('href');
                        if(href.startsWith('/menu'))link.setAttribute('href','menu.html'+href.slice(5));
                        else if(href.startsWith('/cart'))link.setAttribute('href','cart.html');
                        else if(href.startsWith('/checkout'))link.setAttribute('href','checkout.html');
                    });
                }
            })();
        </script>
        <t t-call="website.template_header_mobile"/>
    </xpath>
</data>
