<data name="Template Header Default">
    <xpath expr="//header//nav" position="replace">
        <style>
            .cj-loading-screen{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 30%,rgba(224,241,239,.9),transparent 58%),rgba(247,250,249,.98);backdrop-filter:blur(8px);font-family:Arial,Helvetica,sans-serif}
            .cj-loading-screen.is-hidden{display:none}
            .cj-loading-card{display:grid;width:min(440px,100%);justify-items:center;padding:38px 30px 30px;border:1px solid #dfeae7;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(17,54,49,.12);text-align:center}
            .cj-loading-mark{display:grid;width:56px;height:56px;place-items:center;border:1px solid #d8e9e5;border-radius:17px;color:#fff;background:linear-gradient(145deg,#00999a,#12605d);box-shadow:0 8px 18px rgba(0,139,146,.18);font-family:Georgia,serif;font-size:30px;font-weight:700}
            .cj-loading-eyebrow{margin-top:15px;color:#947251;font-size:9px;font-weight:750;letter-spacing:2px}
            .cj-loading-spinner{width:34px;height:34px;margin-top:27px;border:3px solid #e4eee9;border-top-color:#008b92;border-right-color:#c89b56;border-radius:50%;animation:cjLoadingSpin .85s linear infinite}
            .cj-loading-card h2{margin:21px 0 0;color:#203b38;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500;letter-spacing:-.4px}
            .cj-loading-message{margin:8px 0 0;color:#687b75;font-size:12px}
            .cj-loading-track{width:min(260px,100%);height:4px;overflow:hidden;margin-top:23px;border-radius:99px;background:#e9efec}
            .cj-loading-track span{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#008b92,#c89b56);animation:cjLoadingProgress 1.5s ease-in-out infinite}
            .cj-loading-note{max-width:330px;min-height:34px;margin:13px 0 0;color:#7b897f;font-size:11px;line-height:1.55}
            .cj-default-cart-link{position:relative;display:inline-flex!important;min-width:42px;min-height:42px;align-items:center;justify-content:center;padding:8px 11px!important;border-radius:999px;color:#12605d!important}
            .cj-default-cart-link:hover{background:#e8f4f1;color:#008b92!important}
            .cj-default-cart-icon{display:block;width:21px;height:21px}
            .cj-default-cart-count{position:absolute;top:-2px;right:-4px;display:grid;min-width:18px;height:18px;place-items:center;padding:0 4px;border:2px solid #fff;border-radius:999px;color:#fff;background:#008b92;font-size:10px;font-weight:800;line-height:1}
            @keyframes cjLoadingSpin{to{transform:rotate(360deg)}}
            @keyframes cjLoadingProgress{0%{transform:translateX(-120%)}50%{transform:translateX(150%)}100%{transform:translateX(320%)}}
            @media(max-width:540px){.cj-loading-card{padding:30px 21px 25px}.cj-loading-card h2{font-size:21px}}
            @media(prefers-reduced-motion:reduce){.cj-loading-spinner,.cj-loading-track span{animation:none}.cj-loading-track span{width:100%}}
        </style>
        <div class="cj-loading-screen" id="cjLoadingScreen" role="status" aria-live="polite" aria-busy="true">
            <div class="cj-loading-card">
                <span class="cj-loading-mark" aria-hidden="true">K</span>
                <span class="cj-loading-eyebrow">KALITUSI NATURE RESORT</span>
                <span class="cj-loading-spinner" aria-hidden="true"></span>
                <h2>Getting things ready</h2>
                <p class="cj-loading-message">Loading your resort experience…</p>
                <div class="cj-loading-track" aria-hidden="true"><span></span></div>
                <p class="cj-loading-note" id="cjLoadingNote">Connecting to the resort services…</p>
            </div>
        </div>
        <script>
            (function(){
                var loader=document.getElementById('cjLoadingScreen');
                var loadingNote=document.getElementById('cjLoadingNote');
                var startedAt=Date.now();
                var pageReady=document.readyState==='complete';
                var pendingRequests=0;
                var showTimer=null;
                var hideTimer=null;
                var slowTimer=null;
                var visible=true;
                function setVisible(next){
                    if(!loader||visible===next)return;
                    visible=next;
                    if(next){
                        loader.classList.remove('is-hidden');
                        loader.setAttribute('aria-busy','true');
                        if(loadingNote)loadingNote.textContent='Connecting to the resort services…';
                        slowTimer=window.setTimeout(function(){
                            if(visible&amp;&amp;loadingNote)loadingNote.textContent='The first connection can take a little longer while the resort services wake up. Please keep this page open.';
                        },6000);
                    }else{
                        loader.classList.add('is-hidden');
                        loader.setAttribute('aria-busy','false');
                        if(slowTimer)window.clearTimeout(slowTimer);
                    }
                }
                function scheduleHide(){
                    if(!pageReady||pendingRequests>0)return;
                    if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                    if(hideTimer)window.clearTimeout(hideTimer);
                    var minimumVisible=Math.max(0,700-(Date.now()-startedAt));
                    hideTimer=window.setTimeout(function(){
                        if(pageReady&amp;&amp;pendingRequests===0)setVisible(false);
                    },Math.max(minimumVisible,180));
                }
                function beginRequest(){
                    pendingRequests++;
                    if(hideTimer){window.clearTimeout(hideTimer);hideTimer=null;}
                    if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                    if(!visible){
                        showTimer=window.setTimeout(function(){setVisible(true);},150);
                    }
                }
                function endRequest(){
                    pendingRequests=Math.max(0,pendingRequests-1);
                    if(pendingRequests===0)scheduleHide();
                }
                function markPageReady(){
                    pageReady=true;
                    scheduleHide();
                }
                if(pageReady)markPageReady();
                else window.addEventListener('load',markPageReady,{once:true});
                if(window.fetch&amp;&amp;!window.CJFetchLoadingWrapped){
                    window.CJFetchLoadingWrapped=true;
                    var originalFetch=window.fetch;
                    window.fetch=function(input,options){
                        var url=typeof input==='string'?input:(input&amp;&amp;input.url)||'';
                        if(url.indexOf('/api/v1/')===-1)return originalFetch.apply(this,arguments);
                        beginRequest();
                        var complete=false;
                        function finish(){
                            if(complete)return;
                            complete=true;
                            endRequest();
                        }
                        return originalFetch.apply(this,arguments).then(function(response){
                            finish();
                            return response;
                        },function(error){
                            finish();
                            throw error;
                        });
                    };
                }
                document.addEventListener('click',function(event){
                    if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
                    var link=event.target;
                    while(link&amp;&amp;link.tagName!=='A')link=link.parentNode;
                    if(!link||link.target==='_blank'||link.hasAttribute('download'))return;
                    if(link.hostname===window.location.hostname&amp;&amp;link.pathname!==window.location.pathname){
                        beginRequest();
                    }
                },true);
            })();
        </script>
        <t t-set="_navbar_classes" t-valuef="d-none d-lg-block"/>
        <t t-call="website.navbar" _navbar_classes="_navbar_classes">

            <div id="o_main_nav" t-attf-class="o_main_nav #{header_content_width}">
                <!-- Brand -->
                <t t-call="website.placeholder_header_brand" _link_class.f="me-4"/>
                <!-- Navbar -->
                <t t-call="website.navbar_nav" _nav_class.f="me-auto">
                    <!-- Menu -->
                    <t t-foreach="website.menu_id.child_id" t-as="submenu">
                        <t t-call="website.submenu" item_class.f="nav-item" link_class.f="nav-link"/>
                    </t>
                </t>
                <!-- Extra elements -->
                <ul class="navbar-nav align-items-center gap-2 flex-shrink-0 justify-content-end ps-3">
                    <li class="nav-item">
                        <a class="nav-link cj-default-cart-link" href="/cart" aria-label="Shopping cart" title="Shopping cart">
                            <svg class="cj-default-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="9" cy="20" r="1"/>
                                <circle cx="19" cy="20" r="1"/>
                                <path d="M3 4h2l2.4 11h11l2-7H6"/>
                            </svg>
                            <span class="cj-default-cart-count" id="cjCartCount">0</span>
                        </a>
                    </li>
                    <!-- Search Bar -->
                    <t t-call="website.placeholder_header_search_box" _simple_button_layout="True" _simple_button_classes.f="o_navlink_background rounded-circle p-1 lh-1 text-reset"/>
                    <!-- Text element -->
                    <t t-call="website.placeholder_header_text_element"/>
                    <!-- Social -->
                    <t t-call="website.placeholder_header_social_links"/>
                    <!-- Language Selector -->
                    <t t-call="website.placeholder_header_language_selector" _btn_class="_additional_btn_color or 'nav-link'" _dropdown_menu_class.f="dropdown-menu-end"/>
                    <!-- Sign In -->
                    <t t-call="portal.placeholder_user_sign_in" _link_class="_additional_btn_color or 'o_nav_link_btn nav-link border px-3'"/>
                    <!-- User Dropdown -->
                    <t t-call="portal.user_dropdown" _user_name="True" _item_class.f="dropdown" _link_class.f="{{_additional_btn_color or 'nav-link'}} border-0" _dropdown_menu_class.f="dropdown-menu-end"/>
                    <!-- Call To Action -->
                    <t t-call="website.placeholder_header_call_to_action"/>
                </ul>
            </div>
        </t>
        <script>
            (function(){
                var apiBase=window.CJ_API_BASE_URL||'https://backend-bte7.onrender.com/api/v1';
                var tokenKey='cjCartToken';
                var tokenPromise=null;
                window.CJ_API_BASE_URL=apiBase;
                var badge=document.getElementById('cjCartCount');
                var link=document.querySelector('.cj-default-cart-link');
                function updateCartCount(cart,failed){
                    if(!badge)return;
                    var count=failed?null:Number(cart&amp;&amp;cart.item_count)||0;
                    badge.textContent=failed?'!':String(count);
                    badge.title=failed?'Cart count unavailable':count+' item'+(count===1?'':'s');
                    badge.setAttribute('aria-label',failed?'Cart count unavailable':count+' item'+(count===1?'':'s'));
                    if(link)link.setAttribute('aria-label',failed?'Shopping cart; count unavailable':'Shopping cart, '+count+' item'+(count===1?'':'s'));
                }
                function parseResponse(response){
                    return response.text().then(function(text){
                        var data=null;
                        try{data=text?JSON.parse(text):null;}catch(error){}
                        if(!response.ok){
                            var detail=data&amp;&amp;(data.detail||data.quantity||data.cart_token);
                            throw new Error(typeof detail==='string'?detail:'Cart service returned HTTP '+response.status+'.');
                        }
                        if(!data||typeof data!=='object')throw new Error('Cart service returned invalid data.');
                        return data;
                    });
                }
                function getToken(createIfMissing){
                    var token,legacyItems=[];
                    try{
                        token=localStorage.getItem(tokenKey);
                        if(!token){
                            var legacyCart=[];
                            try{legacyCart=JSON.parse(localStorage.getItem('cjCart')||'[]');}catch(parseError){
                                if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to read the existing cart for migration:',parseError);
                            }
                            if(Array.isArray(legacyCart)){
                                legacyItems=legacyCart.map(function(item){
                                    var quantity=Number(item&amp;&amp;item.qty)||1;
                                    return {
                                        product:String(item&amp;&amp;(item.slug||item.id)||''),
                                        quantity:Math.min(99,Math.max(1,Math.floor(quantity)))
                                    };
                                }).filter(function(item){return Boolean(item.product);});
                            }
                        }
                    }catch(error){return Promise.reject(new Error('Browser storage is unavailable for your cart.'));}
                    if(token)return Promise.resolve(token);
                    if(tokenPromise)return tokenPromise;
                    if(!createIfMissing&&!legacyItems.length)return Promise.resolve(null);
                    var createOptions={method:'POST',headers:{Accept:'application/json'}};
                    if(legacyItems.length){
                        createOptions.headers['Content-Type']='application/json';
                        createOptions.body=JSON.stringify({items:legacyItems});
                    }
                    tokenPromise=window.fetch(apiBase+'/cart/create/',createOptions).then(parseResponse).then(function(data){
                        if(typeof data.token!=='string'||!data.token)throw new Error('Cart service did not return a cart token.');
                        try{
                            localStorage.setItem(tokenKey,data.token);
                            if(legacyItems.length)localStorage.removeItem('cjCart');
                        }catch(error){throw new Error('Browser storage is unavailable for your cart.');}
                        return data.token;
                    }).then(function(value){
                        tokenPromise=null;
                        return value;
                    },function(error){
                        tokenPromise=null;
                        throw error;
                    });
                    return tokenPromise;
                }
                function request(path,options){
                    options=options||{};
                    var createCart=options.createCart===true;
                    delete options.createCart;
                    return getToken(createCart).then(function(token){
                        if(!token){
                            var emptyCart={items:[],item_count:0,subtotal_ugx:0};
                            updateCartCount(emptyCart,false);
                            return emptyCart;
                        }
                        var headers=options.headers||{};
                        headers.Accept='application/json';
                        headers.Authorization='Bearer '+token;
                        if(options.body)headers['Content-Type']='application/json';
                        options.headers=headers;
                        return window.fetch(apiBase+path,options).then(parseResponse);
                    }).then(function(cart){
                        updateCartCount(cart,false);
                        try{localStorage.setItem('cjCartUpdatedAt',String(Date.now()));}catch(error){}
                        return cart;
                    });
                }
                window.CJCart={
                    token:getToken,
                    get:function(){return request('/cart/',{method:'GET'});},
                    refresh:function(){return request('/cart/',{method:'GET'});},
                    add:function(product,quantity){
                        return request('/cart/items/',{method:'POST',createCart:true,body:JSON.stringify({product:product,quantity:quantity})});
                    },
                    setQuantity:function(product,quantity){
                        return request('/cart/items/'+encodeURIComponent(product)+'/',{method:'PATCH',body:JSON.stringify({quantity:quantity})});
                    },
                    remove:function(product){
                        return request('/cart/items/'+encodeURIComponent(product)+'/',{method:'DELETE'});
                    },
                    clear:function(){return request('/cart/',{method:'DELETE'});}
                };
                window.CJCart.refresh().catch(function(error){
                    updateCartCount(null,true);
                    if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to load cart count:',error);
                });
                window.addEventListener('storage',function(event){
                    if(!event.key||event.key===tokenKey||event.key==='cjCartUpdatedAt'){
                        window.CJCart.refresh().catch(function(error){
                            updateCartCount(null,true);
                            if(window.console&amp;&amp;window.console.warn)window.console.warn('Unable to refresh cart count:',error);
                        });
                    }
                });
            })();
        </script>
        <t t-call="website.template_header_mobile"/>
    </xpath>
</data>
