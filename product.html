<t t-name="website.product">
    <t t-call="website.layout">
        <div id="wrap" class="oe_structure oe_empty">
            <style>
                :root{--cj-red:#008B92;--cj-dark:#151515}
                *{box-sizing:border-box} body{background:#fffaf3;color:var(--cj-dark)}
                .cj-product-page{font-family:Arial,Helvetica,sans-serif;min-height:100vh}
                .cj-container{width:min(1180px,calc(100% - 32px));margin:55px auto 90px}
                .cj-breadcrumb{margin-bottom:20px}.cj-breadcrumb a{color:#777;text-decoration:none}
                .cj-layout{display:grid;grid-template-columns:58% 42%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 32px rgba(0,0,0,.08)}
                .cj-image{display:block;width:100%;min-height:520px;height:100%;object-fit:cover;background:#edf0ef}
                .cj-api-status{margin:18px 0;color:#555;line-height:1.5}
                .cj-api-status.error{color:#b42318}
                .cj-details{padding:48px}
                .cj-category{color:var(--cj-red);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:1px}
                .cj-details h1{font-size:48px;letter-spacing:-2px;margin:12px 0}.cj-price{font-size:30px;font-weight:900;color:var(--cj-red)}
                .cj-description{color:#666;line-height:1.7;font-size:17px;margin:22px 0 28px}
                .cj-option-title{font-weight:800;margin:20px 0 10px}.cj-options{display:flex;flex-wrap:wrap;gap:8px}
                .cj-option{border:1px solid #ddd;border-radius:24px;background:#fff;padding:10px 15px;cursor:pointer}
                .cj-option.active{border-color:var(--cj-dark);background:var(--cj-dark);color:#fff}
                .cj-buy-row{display:flex;flex-direction:column;gap:12px;margin-top:32px}
                .cj-pairing{margin-top:28px;background:#fff;border:1px solid #e8ece9;border-radius:8px;padding:26px;box-shadow:0 14px 36px rgba(21,21,21,.08)}
                .cj-pairing-header{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
                .cj-pairing-label{color:var(--cj-red);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.4px}
                .cj-pairing h2{margin:7px 0 0;font-size:24px;letter-spacing:-.8px}
                .cj-pairing p{margin:6px 0 0;color:#777;line-height:1.5;font-size:14px}
                .cj-drinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
                .cj-drink{appearance:none;width:100%;font-family:inherit;text-align:left;position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) 38px;align-items:center;gap:12px;padding:10px;border:1px solid #e4e8e5;border-radius:8px;text-decoration:none;color:var(--cj-dark);background:#fff;transition:.18s ease;cursor:pointer}
                .cj-drink:hover{border-color:var(--cj-red);box-shadow:0 10px 24px rgba(0,139,146,.12);transform:translateY(-2px)}
                .cj-drink img{width:76px;height:76px;border-radius:6px;object-fit:cover}
                .cj-drink-image{width:76px;height:76px;border-radius:6px;background:#edf0ef}
                .cj-drink strong{display:block;font-size:15px;line-height:1.2}
                .cj-drink-info>span{display:block;color:var(--cj-red);font-size:14px;font-weight:800;margin-top:7px}
                .cj-drink-action{width:38px;height:38px;border-radius:50%;background:var(--cj-red);color:#fff;font-size:20px;line-height:38px;text-align:center;box-shadow:0 6px 16px rgba(0,139,146,.22)}
                .cj-drink:hover .cj-drink-action{background:#006F75}
                .cj-modal{display:none;position:fixed;inset:0;z-index:2147483000;background:rgba(15,24,24,.62);align-items:center;justify-content:center;padding:12px}
                .cj-modal.open{display:flex}
                .cj-modal-card{position:relative;width:min(760px,100%);max-height:calc(100vh - 24px);display:grid;grid-template-columns:45% 55%;background:#fff;border-radius:10px;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:cjModalIn .2s ease-out}
                .cj-modal-image{width:100%;height:100%;min-height:300px;object-fit:cover;background:#edf0ef}
                .cj-modal-content{padding:24px;display:flex;flex-direction:column;justify-content:center}
                .cj-modal-category{color:var(--cj-red);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
                .cj-modal-title{font-size:30px;line-height:1.1;margin:10px 0}
                .cj-modal-price{font-size:20px;font-weight:900;color:var(--cj-red)}
                .cj-modal-unit-note{font-size:12px;color:#777;margin-top:3px}
                .cj-modal-total{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;padding:12px 0;border-top:1px solid #e8ece9;font-weight:800}
                .cj-modal-total strong{font-size:18px;color:var(--cj-dark)}
                .cj-modal-description{color:#69716e;line-height:1.6;margin:14px 0 24px}
                .cj-modal-quantity{display:flex;align-items:center;gap:14px;margin:0 0 16px}
                .cj-modal-quantity-label{font-size:13px;font-weight:700;color:#555}
                .cj-modal-qty{display:grid;grid-template-columns:38px 42px 38px;align-items:center;height:38px;border:1px solid #dfe4e1;border-radius:5px;overflow:hidden}
                .cj-modal-qty button{height:36px;border:0;background:#f7f9f8;color:var(--cj-red);font-size:20px;font-weight:700;cursor:pointer}
                .cj-modal-qty button:hover{background:#e7f3f3}
                .cj-modal-qty span{display:grid;place-items:center;height:100%;font-weight:800}
                .cj-modal-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#333;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.14)}
                .cj-modal-add{height:50px;border:0;background:var(--cj-red);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
                .cj-modal-add:hover{background:#006F75}
                body.cj-modal-open{overflow:hidden}
                @keyframes cjModalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
                .cj-qty{width:min(100%, 220px);height:52px;margin:0 auto;border:1px solid #ddd;border-radius:0;display:grid;grid-template-columns:52px 1fr 52px;align-items:center}
                .cj-selected-total{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 0;border-top:1px solid #ecefec;font-weight:700}
                .cj-selected-total strong{font-size:19px;color:var(--cj-red)}
                .cj-qty button{border:0;background:transparent;width:52px;height:50px;font-size:20px;cursor:pointer}.cj-qty span{min-width:30px;text-align:center;font-weight:800}
                .cj-add{width:100%;height:52px;border:0;border-radius:0;background:var(--cj-red);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.cj-add:hover{background:#006F75}
                .cj-toast{position:fixed;right:24px;bottom:88px;background:#222;color:#fff;padding:15px 20px;border-radius:10px;transform:translateY(100px);transition:.25s;z-index:1100}.cj-toast.show{transform:translateY(0)}
                @media(max-width:800px){
                    .cj-container{width:calc(100% - 24px);margin:24px auto 60px}
                    .cj-layout{grid-template-columns:1fr;border-radius:5px}
                    .cj-image{min-height:280px}
                    .cj-details{padding:22px}
                    .cj-details h1{font-size:32px}
                    .cj-description{font-size:15px}
                    .cj-qty{width:min(100%, 180px)}
                    .cj-buy-row{margin-top:24px}
                    .cj-pairing{margin-top:24px}
                    .cj-pairing h2{font-size:19px}
                    .cj-drinks{grid-template-columns:1fr}
                    .cj-pairing{padding:18px}
                    .cj-drink{grid-template-columns:64px minmax(0,1fr) 36px;gap:10px;padding:8px}
                    .cj-drink img{width:64px;height:64px}
                    .cj-drink-image{width:64px;height:64px}
                    .cj-drink-action{width:36px;height:36px;line-height:36px}
                    .cj-modal{padding:8px}
                    .cj-modal-card{grid-template-columns:1fr;max-width:440px;max-height:calc(100vh - 16px)}
                    .cj-modal-image{height:160px;min-height:160px}
                    .cj-modal-content{padding:16px}
                    .cj-modal-title{font-size:23px}
                }
                @media(max-width:420px){
                    .cj-image{min-height:220px}
                    .cj-details{padding:18px}
                    .cj-details h1{font-size:28px}
                    .cj-price{font-size:24px}
                    .cj-toast{right:12px;bottom:calc(76px + env(safe-area-inset-bottom))}
                }
            </style>
            <main class="cj-product-page">
                <t t-call="website.cj_header"/>
                <div class="cj-container">
                    <div class="cj-breadcrumb"><a href="/menu">Menu</a> / <span id="cjBreadcrumb">Product</span></div>
                    <p class="cj-api-status" id="cjProductStatus" role="status" aria-live="polite">Loading item…</p>
                    <div class="cj-layout" id="cjLayout"></div>
                </div>
            </main>
            <div class="cj-toast" id="cjToast">Added to cart</div>
            <script>
                (function(){
                    if(document.getElementById('cjLoadingScreen'))return;
                    var style=document.createElement('style');
                    style.textContent=`
                        .cj-loading-screen{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 30%,rgba(224,241,239,.9),transparent 58%),rgba(247,250,249,.98);backdrop-filter:blur(8px);font-family:Arial,Helvetica,sans-serif}
                        .cj-loading-screen.is-hidden{display:none}
                        .cj-loading-card{display:grid;width:min(440px,100%);justify-items:center;padding:38px 30px 30px;border:1px solid #dfeae7;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(17,54,49,.12);text-align:center}
                        .cj-loading-mark{display:grid;width:56px;height:56px;place-items:center;border:1px solid #d8e9e5;border-radius:17px;color:#fff;background:linear-gradient(145deg,#00999a,#12605d);box-shadow:0 8px 18px rgba(0,139,146,.18);font-family:Georgia,serif;font-size:30px;font-weight:700}
                        .cj-loading-eyebrow{margin-top:15px;color:#947251;font-size:9px;font-weight:750;letter-spacing:2px}
                        .cj-loading-spinner{width:34px;height:34px;margin-top:27px;border:3px solid #e4eee9;border-top-color:#008b92;border-right-color:#c89b56;border-radius:50%;animation:cjLoadingSpin .85s linear infinite}
                        .cj-loading-card h2{margin:21px 0 0;color:#203b38;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500;letter-spacing:-.4px}
                        .cj-loading-message{margin:8px 0 0;color:#687b75;font-size:12px}
                        .cj-loading-track{width:min(260px,100%);height:4px;overflow:hidden;margin-top:23px;border-radius:99px;background:#e9efec}
                        .cj-loading-track span{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#008b92,#c89b56);animation:cjLoadingProgress 1.5s ease-in-out infinite}
                        @keyframes cjLoadingSpin{to{transform:rotate(360deg)}}
                        @keyframes cjLoadingProgress{0%{transform:translateX(-120%)}50%{transform:translateX(150%)}100%{transform:translateX(320%)}}
                        @media(max-width:540px){.cj-loading-card{padding:30px 21px 25px}.cj-loading-card h2{font-size:21px}}
                        @media(prefers-reduced-motion:reduce){.cj-loading-spinner,.cj-loading-track span{animation:none}.cj-loading-track span{width:100%}}
                    `;
                    document.head.appendChild(style);
                    var loader=document.createElement('div');
                    loader.id='cjLoadingScreen';
                    loader.className='cj-loading-screen';
                    loader.setAttribute('role','status');
                    loader.setAttribute('aria-live','polite');
                    loader.setAttribute('aria-busy','true');
                    loader.innerHTML='<div class="cj-loading-card"><span class="cj-loading-mark" aria-hidden="true">K</span><span class="cj-loading-eyebrow">KALITUSI NATURE RESORT</span><span class="cj-loading-spinner" aria-hidden="true"></span><h2>Getting things ready</h2><p class="cj-loading-message">Loading your resort experience…</p><div class="cj-loading-track" aria-hidden="true"><span></span></div></div>';
                    document.body.appendChild(loader);
                    var startedAt=Date.now(),pageReady=document.readyState==='complete',pendingRequests=0,visible=true;
                    var showTimer=null,hideTimer=null;
                    function dataReady(){
                        var status=document.getElementById('cjMenuStatus');
                        if(status)return status.hidden||status.classList.contains('error')||status.textContent.indexOf('Loading the menu')!==0;
                        var productStatus=document.getElementById('cjProductStatus');
                        if(productStatus)return productStatus.hidden||productStatus.classList.contains('error')||productStatus.textContent.indexOf('Loading item')!==0;
                        var cart=document.querySelector('.cj-cart-page #cjLayout');
                        if(cart)return cart.children.length>0;
                        var summary=document.getElementById('cjSummary');
                        if(summary)return summary.children.length>0;
                        return true;
                    }
                    function setVisible(next){
                        if(visible===next)return;
                        visible=next;
                        if(next){
                            loader.classList.remove('is-hidden');
                            loader.setAttribute('aria-busy','true');
                        }else{
                            loader.classList.add('is-hidden');
                            loader.setAttribute('aria-busy','false');
                        }
                    }
                    function update(){
                        if(!pageReady||pendingRequests>0||!dataReady())return;
                        if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                        if(hideTimer)window.clearTimeout(hideTimer);
                        hideTimer=window.setTimeout(function(){if(pageReady&&pendingRequests===0&&dataReady())setVisible(false);},Math.max(180,700-(Date.now()-startedAt)));
                    }
                    function beginRequest(){
                        pendingRequests++;
                        if(hideTimer){window.clearTimeout(hideTimer);hideTimer=null;}
                        if(showTimer){window.clearTimeout(showTimer);showTimer=null;}
                        if(!visible)showTimer=window.setTimeout(function(){setVisible(true);},150);
                    }
                    function endRequest(){pendingRequests=Math.max(0,pendingRequests-1);update();}
                    if(!pageReady)window.addEventListener('load',function(){pageReady=true;update();},{once:true});
                    if(window.fetch&&!window.CJPageFetchWrapped){
                        window.CJPageFetchWrapped=true;
                        var originalFetch=window.fetch;
                        window.fetch=function(input,options){
                            var url=typeof input==='string'?input:(input&&input.url)||'';
                            if(url.indexOf('/api/v1/')===-1||url.indexOf('/cart/')!==-1)return originalFetch.apply(this,arguments);
                            beginRequest();
                            var complete=false;
                            function finish(){if(complete)return;complete=true;endRequest();}
                            var request;
                            try{request=originalFetch.apply(this,arguments);}catch(error){finish();throw error;}
                            return request.then(function(response){finish();return response;},function(error){finish();throw error;});
                        };
                    }
                    new MutationObserver(update).observe(document.body,{subtree:true,childList:true,attributes:true,characterData:true});
                    window.setTimeout(update,0);
                })();
            </script>
            <script>
                (function(){
                    if(window.location.protocol==='file:'){
                        document.querySelectorAll('a[href]').forEach(function(link){
                            var href=link.getAttribute('href');
                            if(href.startsWith('/menu'))link.setAttribute('href','menu.html'+href.slice(5));
                            else if(href.startsWith('/cart'))link.setAttribute('href','cart.html');
                            else if(href.startsWith('/checkout'))link.setAttribute('href','checkout.html');
                        });
                    }
                    var key='cjCart';
                    var apiBase=window.CJ_API_BASE_URL||'https://backend-bte7.onrender.com/api/v1';
                    function escapeHtml(value){
                        return String(value==null?'':value).replace(/[&<>"']/g,function(character){
                            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
                        });
                    }
                    function safeImageUrl(value){
                        try{
                            var url=new URL(value,apiBase);
                            return url.protocol==='http:'||url.protocol==='https:'?url.href:'';
                        }catch(e){return '';}
                    }
                    function getCart(){try{return JSON.parse(localStorage.getItem(key))||[];}catch(e){return[];}}
                    function saveCart(cart){
                        try{
                            localStorage.setItem(key,JSON.stringify(cart));
                            window.dispatchEvent(new CustomEvent('cjCartUpdated'));
                        }
                        catch(e){console.warn('Unable to save cart',e);}
                        updateCount();
                    }
                    function updateCount(){
                        if(window.CJCart&&window.location.protocol!=='file:')return;
                        var count=getCart().reduce(function(n,i){return n+(i.qty||1);},0);
                        var badge=document.getElementById('cjCartCount');
                        if(badge)badge.textContent=count;
                        var badges=document.querySelectorAll('[id="cjCartCount"]');
                        badges.forEach(function(item){item.textContent=count;});
                    }
                    function addToCart(product,quantity){
                        if(window.CJCart&&window.location.protocol!=='file:'){
                            return window.CJCart.add(product.slug,quantity);
                        }
                        var cart=getCart(),item=cart.find(function(i){return i.id===product.slug;});
                        if(item)item.qty=(item.qty||1)+quantity;
                        else cart.push({id:product.slug,name:product.name,price:product.price,image:product.image,qty:quantity});
                        saveCart(cart);
                        return Promise.resolve();
                    }
                    function renderProduct(product,products){
                    document.getElementById('cjBreadcrumb').textContent=product.name;
                    var pairing='';
                    var recommendations=products.filter(function(p){return p.slug!==product.slug;}).sort(function(a,b){
                        function rank(item){
                            if(product.category_slug==='drinks')return item.category_slug==='sides'?0:1;
                            return item.category_slug==='drinks'?0:item.category_slug==='sides'?1:2;
                        }
                        return rank(a)-rank(b);
                    }).slice(0,4);
                    if(recommendations.length){
                        pairing='<section class="cj-pairing"><div class="cj-pairing-header"><div><div class="cj-pairing-label">Recommended for you</div><h2>Make your order extra special</h2><p>Tap an item to see more and add it to your order.</p></div></div><div class="cj-drinks">'+recommendations.map(function(item){
                            var image=safeImageUrl(item.image);
                            var imageMarkup=image?'<img src="'+escapeHtml(image)+'" alt=""/>':'<span class="cj-drink-image" aria-hidden="true"></span>';
                            return '<button type="button" class="cj-drink" data-recommendation="'+escapeHtml(item.slug)+'" aria-label="View '+escapeHtml(item.name)+' details">'+imageMarkup+'<span class="cj-drink-info"><strong>'+escapeHtml(item.name)+'</strong><span>UGX '+Number(item.price).toLocaleString('en-UG')+'</span></span><span class="cj-drink-action" aria-hidden="true">+</span></button>';
                        }).join('')+'</div></section>';
                    }
                    var image=safeImageUrl(product.image);
                    var imageMarkup=image?'<img class="cj-image" src="'+escapeHtml(image)+'" alt="'+escapeHtml(product.name)+'"/>':'<div class="cj-image" aria-hidden="true"></div>';
                    document.getElementById('cjLayout').innerHTML=imageMarkup+'<div class="cj-details"><div class="cj-category">'+escapeHtml(product.category_name)+'</div><h1>'+escapeHtml(product.name)+'</h1><div class="cj-price">UGX '+Number(product.price).toLocaleString('en-UG')+'</div><p class="cj-description">'+escapeHtml(product.description)+'</p><div class="cj-option-title">Choose option</div><div class="cj-options"><button class="cj-option active">Regular</button><button class="cj-option">Large</button></div><div class="cj-buy-row"><div class="cj-selected-total"><span>Item total</span><strong id="cjProductTotal">UGX '+Number(product.price).toLocaleString('en-UG')+'</strong></div><div class="cj-qty"><button id="cjMinus">-</button><span id="cjQty">1</span><button id="cjPlus">+</button></div><a class="cj-add" id="cjAdd" href="/cart">Order Now</a></div></div>';
                    document.getElementById('cjLayout').insertAdjacentHTML('afterend',pairing);
                    document.getElementById('cjLayout').insertAdjacentHTML('afterend','<div class="cj-modal" id="cjRecommendationModal" aria-hidden="true"><div class="cj-modal-card" role="dialog" aria-modal="true" aria-labelledby="cjModalTitle"><button type="button" class="cj-modal-close" id="cjModalClose" aria-label="Close">×</button><img class="cj-modal-image" id="cjModalImage" alt=""/><div class="cj-modal-content"><div class="cj-modal-category" id="cjModalCategory"></div><h2 class="cj-modal-title" id="cjModalTitle"></h2><div class="cj-modal-price" id="cjModalPrice"></div><div class="cj-modal-unit-note">Price per item</div><p class="cj-modal-description" id="cjModalDescription"></p><div class="cj-modal-quantity"><span class="cj-modal-quantity-label">Quantity</span><div class="cj-modal-qty"><button type="button" id="cjModalMinus" aria-label="Decrease quantity">−</button><span id="cjModalQty">1</span><button type="button" id="cjModalPlus" aria-label="Increase quantity">+</button></div></div><div class="cj-modal-total"><span>Item total</span><strong id="cjModalTotal"></strong></div><button type="button" class="cj-modal-add" id="cjModalAdd">Add to order</button></div></div></div>');
                    document.body.appendChild(document.getElementById('cjRecommendationModal'));
                    if(window.location.protocol==='file:')document.getElementById('cjAdd').setAttribute('href','cart.html');
                    var qty=1;
                    function updateProductQuantity(){
                        document.getElementById('cjQty').textContent=qty;
                        document.getElementById('cjProductTotal').textContent='UGX '+(product.price*qty).toLocaleString('en-UG');
                    }
                    document.getElementById('cjMinus').onclick=function(){qty=Math.max(1,qty-1);updateProductQuantity();};
                    document.getElementById('cjPlus').onclick=function(){qty=Math.min(99,qty+1);updateProductQuantity();};
                    document.querySelectorAll('.cj-option').forEach(function(button){button.onclick=function(){document.querySelectorAll('.cj-option').forEach(function(b){b.classList.remove('active');});button.classList.add('active');};});
                    var modal=document.getElementById('cjRecommendationModal'),selectedRecommendation=null,modalQty=1;
                    var modalClose=document.getElementById('cjModalClose');
                    var modalQtyDisplay=document.getElementById('cjModalQty');
                    function updateModalQuantity(){
                        modalQtyDisplay.textContent=modalQty;
                        if(selectedRecommendation)document.getElementById('cjModalTotal').textContent='UGX '+(selectedRecommendation.price*modalQty).toLocaleString('en-UG');
                    }
                    document.getElementById('cjModalMinus').addEventListener('click',function(){modalQty=Math.max(1,modalQty-1);updateModalQuantity();});
                    document.getElementById('cjModalPlus').addEventListener('click',function(){modalQty=Math.min(99,modalQty+1);updateModalQuantity();});
                    function closeRecommendation(){
                        modal.classList.remove('open');
                        modal.setAttribute('aria-hidden','true');
                        document.body.classList.remove('cj-modal-open');
                    }
                    document.querySelectorAll('.cj-drink[data-recommendation]').forEach(function(card){
                        card.addEventListener('click',function(){
                            selectedRecommendation=products.find(function(p){return p.slug===card.dataset.recommendation;});
                            if(!selectedRecommendation)return;
                            var cardImage=card.querySelector('img');
                            var modalImage=document.getElementById('cjModalImage');
                            modalImage.removeAttribute('src');
                            modalImage.alt=selectedRecommendation.name;
                            var recommendationImage=safeImageUrl(selectedRecommendation.image);
                            if(recommendationImage)modalImage.src=recommendationImage;
                            document.getElementById('cjModalCategory').textContent=selectedRecommendation.category_name;
                            document.getElementById('cjModalTitle').textContent=selectedRecommendation.name;
                            document.getElementById('cjModalPrice').textContent='UGX '+selectedRecommendation.price.toLocaleString('en-UG');
                            document.getElementById('cjModalDescription').textContent=selectedRecommendation.description;
                            modalQty=1;
                            updateModalQuantity();
                            modal.classList.add('open');
                            modal.setAttribute('aria-hidden','false');
                            document.body.classList.add('cj-modal-open');
                            modalClose.focus();
                        });
                    });
                    modalClose.addEventListener('click',closeRecommendation);
                    modal.addEventListener('click',function(e){if(e.target===modal)closeRecommendation();});
                    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open'))closeRecommendation();});
                    document.getElementById('cjModalAdd').addEventListener('click',function(){
                        if(!selectedRecommendation)return;
                        var button=this;
                        button.disabled=true;
                        var toast=document.getElementById('cjToast');
                        addToCart(selectedRecommendation,modalQty).then(function(){
                            closeRecommendation();
                            toast.textContent=selectedRecommendation.name+' added to your order';
                            toast.classList.add('show');
                            setTimeout(function(){toast.classList.remove('show');toast.textContent='Added to cart';},1600);
                        },function(error){
                            toast.textContent=error.message||'Unable to add this item. Please try again.';
                            toast.classList.add('show');
                            setTimeout(function(){toast.classList.remove('show');toast.textContent='Added to cart';},3000);
                        }).then(function(){button.disabled=false;});
                    });
                    document.getElementById('cjAdd').onclick=function(e){
                        e.preventDefault();
                        var button=this;
                        button.disabled=true;
                        addToCart(product,qty).then(function(){
                            window.location.assign(window.location.protocol==='file:'?'cart.html':'/cart');
                        },function(error){
                            var status=document.getElementById('cjProductStatus');
                            status.textContent=error.message||'Unable to add this item. Please try again.';
                            status.hidden=false;
                            button.disabled=false;
                        });
                    };
                    updateCount();
                    document.getElementById('cjProductStatus').hidden=true;
                    }
                    var productId=new URLSearchParams(window.location.search).get('id');
                    fetch(apiBase+'/products/',{headers:{Accept:'application/json'}}).then(function(response){
                        if(!response.ok)throw new Error('The menu service returned HTTP '+response.status+'.');
                        return response.json();
                    }).then(function(data){
                        if(!Array.isArray(data))throw new Error('The menu service returned invalid data.');
                        var product=data.find(function(item){return item.slug===productId;});
                        if(!product){
                            document.getElementById('cjProductStatus').textContent='This item is no longer available. Please return to the menu.';
                            document.getElementById('cjProductStatus').classList.add('error');
                            return;
                        }
                        renderProduct(product,data);
                    }).catch(function(error){
                        document.getElementById('cjProductStatus').textContent=error instanceof Error?error.message:'Could not load this item. Please try again.';
                        document.getElementById('cjProductStatus').classList.add('error');
                    });
                })();
            </script>
            <script>
                (function(){
                    if(document.getElementById('cjFloatingCart'))return;
                    var style=document.createElement('style');
                    style.textContent=`
                        .cj-floating-cart{position:fixed;right:24px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:1080;font-family:Arial,Helvetica,sans-serif}
                        .cj-floating-cart-trigger{position:relative;display:grid;width:58px;height:58px;place-items:center;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:50%;color:#fff;background:linear-gradient(135deg,#087d79,#125c59);box-shadow:0 12px 30px rgba(8,76,72,.25);cursor:pointer}
                        .cj-floating-cart-trigger:focus-visible,.cj-floating-cart button:focus-visible,.cj-floating-cart a:focus-visible{outline:3px solid #d5ab64;outline-offset:3px}
                        .cj-floating-cart-icon{width:24px;height:24px}
                        .cj-floating-cart-count{position:absolute;top:-5px;right:-5px;display:grid;min-width:22px;height:22px;place-items:center;padding:0 5px;border:2px solid #fff;border-radius:999px;color:#155d59;background:#d5ab64;font-size:11px;font-weight:900}
                        .cj-floating-cart-panel{position:absolute;right:0;bottom:72px;display:flex;width:min(390px,calc(100vw - 28px));max-height:min(70vh,560px);flex-direction:column;overflow:hidden;border:1px solid #e3ebe7;border-radius:18px;background:#fff;box-shadow:0 22px 65px rgba(12,46,43,.22);color:#203b38}
                        .cj-floating-cart-panel[hidden]{display:none}
                        .cj-floating-cart-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #edf1ef}
                        .cj-floating-cart-header h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:500}
                        .cj-floating-cart-header p{margin:4px 0 0;color:#73837d;font-size:12px}
                        .cj-floating-cart-close{width:34px;height:34px;border:0;border-radius:50%;color:#52655e;background:#f1f5f3;font-size:23px;line-height:1;cursor:pointer}
                        .cj-floating-cart-items{min-height:92px;overflow:auto;padding:6px 16px}
                        .cj-floating-cart-item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid #edf1ef}
                        .cj-floating-cart-item:last-child{border-bottom:0}
                        .cj-floating-cart-item-image{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#edf3f0}
                        .cj-floating-cart-item-name{display:block;overflow:hidden;color:#263c38;font-size:13px;font-weight:750;text-overflow:ellipsis;white-space:nowrap}
                        .cj-floating-cart-item-price{display:block;margin-top:4px;color:#74817b;font-size:12px}
                        .cj-floating-cart-item-total{display:block;margin-top:3px;color:#126b66;font-size:12px;font-weight:800}
                        .cj-floating-cart-controls{display:flex;align-items:center;gap:7px}
                        .cj-floating-cart-qty{min-width:20px;text-align:center;font-size:12px;font-weight:800}
                        .cj-floating-cart-qty-button,.cj-floating-cart-remove{display:grid;width:29px;height:29px;place-items:center;border:1px solid #dce5e1;border-radius:8px;color:#126b66;background:#fff;font-size:17px;font-weight:700;cursor:pointer}
                        .cj-floating-cart-qty-button:disabled{opacity:.42;cursor:not-allowed}
                        .cj-floating-cart-remove{border-color:#f0dcda;color:#b34842;font-size:15px}
                        .cj-floating-cart-message{margin:0;padding:24px 12px;color:#75837d;font-size:13px;text-align:center}
                        .cj-floating-cart-footer{padding:15px 19px 18px;border-top:1px solid #edf1ef;background:#fbfcfb}
                        .cj-floating-cart-subtotal{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#73817c;font-size:13px}
                        .cj-floating-cart-subtotal strong{color:#203b38;font-size:16px}
                        .cj-floating-cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
                        .cj-floating-cart-actions a{display:grid;min-height:43px;place-items:center;border-radius:10px;text-decoration:none;font-size:13px;font-weight:800}
                        .cj-floating-cart-view{border:1px solid #dce7e2;color:#17635f;background:#fff}
                        .cj-floating-cart-checkout{color:#fff;background:#087d79}
                        .cj-floating-cart-checkout[hidden]{display:none}
                        @media(max-width:620px){.cj-floating-cart{right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}.cj-floating-cart-trigger{width:52px;height:52px}.cj-floating-cart-panel{bottom:63px;max-height:68vh}.cj-floating-cart-header{padding:15px 16px}.cj-floating-cart-items{padding:4px 12px}.cj-floating-cart-item{grid-template-columns:50px minmax(0,1fr) auto;gap:8px}.cj-floating-cart-item-image{width:50px;height:50px}.cj-floating-cart-controls{gap:5px}}
                    `;
                    document.head.appendChild(style);
                    var root=document.createElement('div');
                    root.id='cjFloatingCart';
                    root.className='cj-floating-cart';
                    root.innerHTML=`
                        <button class="cj-floating-cart-trigger" id="cjFloatingCartTrigger" type="button" aria-expanded="false" aria-controls="cjFloatingCartPanel" aria-label="Open shopping cart">
                            <svg class="cj-floating-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.4 11h11l2-7H6"/></svg>
                            <span class="cj-floating-cart-count" id="cjFloatingCartCount">0</span>
                        </button>
                        <section class="cj-floating-cart-panel" id="cjFloatingCartPanel" role="dialog" aria-modal="false" aria-labelledby="cjFloatingCartTitle" hidden>
                            <header class="cj-floating-cart-header"><div><h2 id="cjFloatingCartTitle">Your cart</h2><p id="cjFloatingCartItemCount">0 items</p></div><button class="cj-floating-cart-close" id="cjFloatingCartClose" type="button" aria-label="Close cart">×</button></header>
                            <div class="cj-floating-cart-items" id="cjFloatingCartItems" aria-live="polite"><p class="cj-floating-cart-message">Loading your cart…</p></div>
                            <footer class="cj-floating-cart-footer"><div class="cj-floating-cart-subtotal"><span>Subtotal</span><strong id="cjFloatingCartSubtotal">UGX 0</strong></div><div class="cj-floating-cart-actions"><a class="cj-floating-cart-view" href="/cart">View cart</a><a class="cj-floating-cart-checkout" id="cjFloatingCartCheckout" href="/checkout" hidden>Checkout</a></div></footer>
                        </section>
                    `;
                    document.body.appendChild(root);
                    var trigger=root.querySelector('#cjFloatingCartTrigger');
                    var panel=root.querySelector('#cjFloatingCartPanel');
                    var itemsNode=root.querySelector('#cjFloatingCartItems');
                    var countNode=root.querySelector('#cjFloatingCartCount');
                    var currentItems=[];
                    function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
                    function formatMoney(value){return 'UGX '+Number(value||0).toLocaleString('en-UG');}
                    function localCart(){
                        var data=[];
                        try{data=JSON.parse(localStorage.getItem('cjCart')||'[]');}catch(error){}
                        var items=Array.isArray(data)?data.map(function(item){return {product:String(item.slug||item.id||''),name:item.name||'',price:Number(item.price)||0,image:item.image||'',quantity:Number(item.qty)||1};}).filter(function(item){return Boolean(item.product);}):[];
                        return {items:items,item_count:items.reduce(function(n,item){return n+item.quantity;},0),subtotal_ugx:items.reduce(function(n,item){return n+item.price*item.quantity;},0)};
                    }
                    function render(cart){
                        currentItems=Array.isArray(cart.items)?cart.items:[];
                        var count=Number(cart.item_count)||0,subtotal=Number(cart.subtotal_ugx)||0;
                        var countText=count+' item'+(count===1?'':'s');
                        countNode.textContent=String(count);
                        root.querySelector('#cjFloatingCartItemCount').textContent=countText;
                        root.querySelector('#cjFloatingCartSubtotal').textContent=formatMoney(subtotal);
                        root.querySelector('#cjFloatingCartCheckout').hidden=count===0;
                        trigger.setAttribute('aria-label','Open shopping cart, '+countText+', '+formatMoney(subtotal));
                        if(!currentItems.length){itemsNode.innerHTML='<p class="cj-floating-cart-message">Your cart is empty. <a href="/menu">Browse the menu</a></p>';return;}
                        itemsNode.innerHTML=currentItems.map(function(item){
                            var image='';
                            if(item.image){try{var url=new URL(item.image,window.CJ_API_BASE_URL||window.location.href);if(url.protocol==='http:'||url.protocol==='https:')image='<img class="cj-floating-cart-item-image" src="'+escapeHtml(url.href)+'" alt=""/>';}catch(error){}}
                            var line=Number(item.price)*Number(item.quantity);
                            return '<article class="cj-floating-cart-item">'+(image||'<span class="cj-floating-cart-item-image" aria-hidden="true"></span>')+'<div><span class="cj-floating-cart-item-name">'+escapeHtml(item.name)+'</span><span class="cj-floating-cart-item-price">'+formatMoney(item.price)+' each</span><span class="cj-floating-cart-item-total">'+formatMoney(line)+'</span></div><div class="cj-floating-cart-controls"><button class="cj-floating-cart-qty-button" type="button" data-action="minus" data-product="'+escapeHtml(item.product)+'" aria-label="Decrease quantity">−</button><span class="cj-floating-cart-qty">'+item.quantity+'</span><button class="cj-floating-cart-qty-button" type="button" data-action="plus" data-product="'+escapeHtml(item.product)+'" aria-label="Increase quantity" '+(Number(item.quantity)>=99?'disabled':'')+'>+</button><button class="cj-floating-cart-remove" type="button" data-action="remove" data-product="'+escapeHtml(item.product)+'" aria-label="Remove item">×</button></div></article>';
                        }).join('');
                    }
                    function showError(error){itemsNode.innerHTML='<p class="cj-floating-cart-message">'+escapeHtml(error.message||'Unable to load your cart.')+' <button type="button" id="cjFloatingCartRetry">Retry</button></p>';}
                    function loadCart(){
                        if(window.CJCart&&window.location.protocol!=='file:')window.CJCart.get().then(render).catch(showError);
                        else render(localCart());
                    }
                    function setOpen(open){panel.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open)loadCart();}
                    trigger.addEventListener('click',function(){setOpen(panel.hidden);});
                    root.querySelector('#cjFloatingCartClose').addEventListener('click',function(){setOpen(false);trigger.focus();});
                    document.addEventListener('click',function(event){if(!panel.hidden&&!root.contains(event.target))setOpen(false);});
                    document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!panel.hidden){setOpen(false);trigger.focus();}});
                    itemsNode.addEventListener('click',function(event){
                        if(event.target.closest('#cjFloatingCartRetry')){loadCart();return;}
                        var button=event.target.closest('button[data-action]');
                        if(!button)return;
                        var item=currentItems.find(function(entry){return String(entry.product)===button.dataset.product;});
                        if(!item)return;
                        if(window.CJCart&&window.location.protocol!=='file:'){
                            var request=button.dataset.action==='remove'?window.CJCart.remove(item.product):window.CJCart.setQuantity(item.product,item.quantity+(button.dataset.action==='plus'?1:-1));
                            request.then(render).catch(showError);
                            return;
                        }
                        var cart=localCart(),localItem=cart.items.find(function(entry){return entry.product===item.product;});
                        if(!localItem)return;
                        if(button.dataset.action==='remove'||(button.dataset.action==='minus'&&localItem.quantity<=1))cart.items=cart.items.filter(function(entry){return entry.product!==item.product;});
                        else localItem.quantity=Math.min(99,localItem.quantity+(button.dataset.action==='plus'?1:-1));
                        cart.item_count=cart.items.reduce(function(n,entry){return n+entry.quantity;},0);
                        cart.subtotal_ugx=cart.items.reduce(function(n,entry){return n+entry.price*entry.quantity;},0);
                        try{localStorage.setItem('cjCart',JSON.stringify(cart.items.map(function(entry){return {id:entry.product,name:entry.name,price:entry.price,image:entry.image,qty:entry.quantity};})));}
                        catch(error){showError(new Error('Unable to save your cart. Check browser storage and try again.'));return;}
                        render(cart);
                        window.dispatchEvent(new CustomEvent('cjCartUpdated'));
                    });
                    window.addEventListener('cjCartUpdated',function(event){if(event.detail&&event.detail.cart)render(event.detail.cart);else loadCart();});
                    window.addEventListener('storage',function(event){if(!event.key||event.key==='cjCart'||event.key==='cjCartToken')loadCart();});
                    if(window.location.protocol==='file:')root.querySelectorAll('a[href]').forEach(function(link){var href=link.getAttribute('href');if(href==='/cart')link.href='cart.html';else if(href==='/checkout')link.href='checkout.html';else if(href==='/menu')link.href='menu.html';});
                    loadCart();
                })();
            </script>
        </div>
