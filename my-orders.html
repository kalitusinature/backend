<t t-name="website.cj_my_orders">
    <t t-call="website.layout">
        <div id="wrap" class="oe_structure oe_empty">
            <style>
                .cj-orders-page{min-height:100vh;background:#f4f7f6;color:#242b27;font-family:Arial,Helvetica,sans-serif}
                .cj-orders-container{width:min(900px,calc(100% - 32px));margin:46px auto 80px}
                .cj-orders-heading{margin-bottom:24px}
                .cj-orders-heading .eyebrow{color:#008B92;font-size:12px;font-weight:800;letter-spacing:1.6px}
                .cj-orders-heading h1{margin:8px 0;font-size:38px;letter-spacing:-1px}
                .cj-orders-heading p{max-width:620px;margin:0;color:#6f7a74;line-height:1.6}
                .cj-orders-lookup,.cj-order-result{padding:24px;background:#fff;border:1px solid #e3e9e5;border-radius:10px;box-shadow:0 12px 32px rgba(21,40,30,.06)}
                .cj-orders-lookup,.cj-order-code-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px}
                .cj-orders-lookup[hidden],.cj-order-code-form[hidden],.cj-order-reset[hidden]{display:none}
                .cj-orders-field{display:grid;gap:7px}
                .cj-orders-field label{color:#47564e;font-size:13px;font-weight:700}
                .cj-orders-field input{width:100%;height:46px;padding:0 12px;border:1px solid #d6dfd9;border-radius:6px;color:#27342d;background:#fff;font-size:15px}
                .cj-orders-field input:focus{outline:2px solid rgba(0,139,146,.18);border-color:#008B92}
                .cj-orders-submit{height:46px;padding:0 20px;border:0;border-radius:6px;color:#fff;background:#008B92;font-size:14px;font-weight:800;cursor:pointer}
                .cj-orders-submit:disabled{opacity:.6;cursor:wait}
                .cj-order-code-copy{grid-column:1/-1;margin:0;color:#6f7a74;font-size:13px;line-height:1.5}
                .cj-order-reset{margin:12px 0 0;padding:0;border:0;color:#007a80;background:transparent;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer}
                .cj-orders-older-receipt{margin-top:24px;padding-top:18px;border-top:1px solid #e3e9e5}
                .cj-orders-older-receipt summary{color:#007a80;font-size:13px;font-weight:700;cursor:pointer}
                .cj-orders-older-receipt form{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:12px;margin-top:16px}
                .cj-orders-older-receipt-result:empty{display:none}
                .cj-order-notice{min-height:24px;margin:16px 0;color:#557064;font-size:13px}
                .cj-order-notice.error{color:#a63d36}
                .cj-order-result{display:grid;gap:14px;margin-top:8px}
                .cj-order-result:empty{display:none}
                .cj-order-card{padding:24px;background:#fff;border:1px solid #e3e9e5;border-radius:10px;box-shadow:0 12px 32px rgba(21,40,30,.06)}
                .cj-order-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid #edf1ee}
                .cj-order-heading h2{margin:0;color:#2e4539;font-size:23px}
                .cj-order-heading small{display:block;margin-top:5px;color:#89968f;font-size:12px}
                .cj-order-status{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:20px;color:#315b48;background:#eaf4ed;font-size:12px;font-weight:800}
                .cj-order-status.cancelled{color:#99443f;background:#fff0ee}
                .cj-order-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}
                .cj-order-meta div{display:grid;gap:5px}
                .cj-order-meta span{color:#89968f;font-size:11px}
                .cj-order-meta strong{color:#41534a;font-size:13px}
                .cj-order-items h3{margin:0 0 8px;color:#41534a;font-size:14px}
                .cj-order-item{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #eff2f0;color:#5e6d65;font-size:13px}
                .cj-order-item strong{color:#34483c;white-space:nowrap}
                .cj-order-total{display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:#34483c;font-size:17px;font-weight:800}
                .cj-order-update-note{margin:18px 0 0;color:#6f7a74;font-size:12px;line-height:1.5}
                .cj-order-receipts{margin-top:24px;padding-top:18px;border-top:1px solid #edf1ee}
                .cj-order-receipts h3{margin:0 0 10px;color:#41534a;font-size:15px}
                .cj-order-receipt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eff2f0;color:#5e6d65;font-size:12px}
                .cj-order-receipt strong{display:block;color:#34483c}
                .cj-order-receipt small{display:block;margin-top:4px;color:#89968f}
                .cj-order-receipt button{min-height:36px;padding:0 12px;border:0;border-radius:6px;color:#fff;background:#008B92;font-size:12px;font-weight:800;cursor:pointer}
                .cj-order-receipt button:disabled{opacity:.6;cursor:wait}
                @media(max-width:680px){
                    .cj-orders-container{width:calc(100% - 24px);margin:28px auto 56px}
                    .cj-orders-heading h1{font-size:32px}
                    .cj-orders-lookup,.cj-order-code-form{grid-template-columns:1fr}
                    .cj-order-code-copy{grid-column:auto}
                    .cj-orders-older-receipt form{grid-template-columns:1fr}
                    .cj-orders-submit{width:100%}
                    .cj-order-meta{grid-template-columns:1fr 1fr}
                }
                @media(max-width:420px){.cj-order-heading{align-items:flex-start;flex-direction:column}.cj-order-meta{grid-template-columns:1fr}.cj-order-receipt{align-items:flex-start;flex-direction:column}}
            </style>
            <main class="cj-orders-page">
                <t t-call="website.cj_header"/>
                <div class="cj-orders-container">
                    <header class="cj-orders-heading">
                        <div class="eyebrow">YOUR RECENT ORDERS</div>
                        <h1>My Orders</h1>
                        <p>Verify your email address to view orders placed with it during the last two days. We will send a one-time code to your inbox.</p>
                    </header>
                    <form id="cjOrderLookup" class="cj-orders-lookup">
                        <div class="cj-orders-field">
                            <label for="cjOrderEmail">Email address</label>
                            <input id="cjOrderEmail" name="email" type="email" required="required" maxlength="254" autocomplete="email" placeholder="you@example.com"/>
                        </div>
                        <button class="cj-orders-submit" id="cjOrderSubmit" type="submit">Email me a code</button>
                    </form>
                    <form id="cjOrderCodeForm" class="cj-order-code-form" hidden>
                        <p class="cj-order-code-copy" id="cjOrderCodeCopy"></p>
                        <div class="cj-orders-field">
                            <label for="cjOrderCode">6-digit verification code</label>
                            <input id="cjOrderCode" name="code" type="text" required="required" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"/>
                        </div>
                        <button class="cj-orders-submit" id="cjOrderVerify" type="submit">Verify and show orders</button>
                    </form>
                    <button class="cj-order-reset" id="cjOrderReset" type="button" hidden>Use a different email</button>
                    <div class="cj-order-notice" id="cjOrderNotice" role="status" aria-live="polite"></div>
                    <section class="cj-order-result" id="cjOrderResult" aria-label="Recent orders"></section>
                    <details class="cj-orders-older-receipt">
                        <summary>Looking for a receipt from an older order?</summary>
                        <form id="cjOlderReceiptLookup">
                            <div class="cj-orders-field">
                                <label for="cjOlderOrderNumber">Order number</label>
                                <input id="cjOlderOrderNumber" name="number" required="required" maxlength="20" autocomplete="off" placeholder="e.g. KR-1234ABCD"/>
                            </div>
                            <div class="cj-orders-field">
                                <label for="cjOlderOrderEmail">Email address</label>
                                <input id="cjOlderOrderEmail" name="email" type="email" required="required" maxlength="254" autocomplete="email" placeholder="you@example.com"/>
                            </div>
                            <button class="cj-orders-submit" id="cjOlderReceiptSubmit" type="submit">Find receipt</button>
                        </form>
                        <section class="cj-orders-older-receipt-result" id="cjOlderReceiptResult" aria-label="Older order receipts"></section>
                    </details>
                </div>
            </main>
            <script>
                (function(){
                    var apiBase=(window.CJ_API_BASE_URL||'https://api.kalitusi.com/api/v1').replace(/\/+$/,'');
                    var form=document.getElementById('cjOrderLookup');
                    var emailInput=document.getElementById('cjOrderEmail');
                    var submitButton=document.getElementById('cjOrderSubmit');
                    var codeForm=document.getElementById('cjOrderCodeForm');
                    var codeInput=document.getElementById('cjOrderCode');
                    var verifyButton=document.getElementById('cjOrderVerify');
                    var codeCopy=document.getElementById('cjOrderCodeCopy');
                    var resetButton=document.getElementById('cjOrderReset');
                    var notice=document.getElementById('cjOrderNotice');
                    var result=document.getElementById('cjOrderResult');
                    var olderReceiptForm=document.getElementById('cjOlderReceiptLookup');
                    var olderOrderNumber=document.getElementById('cjOlderOrderNumber');
                    var olderOrderEmail=document.getElementById('cjOlderOrderEmail');
                    var olderReceiptSubmit=document.getElementById('cjOlderReceiptSubmit');
                    var olderReceiptResult=document.getElementById('cjOlderReceiptResult');
                    var isFetching=false;

                    function showNotice(message,isError){
                        notice.textContent=message;
                        notice.className='cj-order-notice'+(isError?' error':'');
                    }

                    function addMeta(container,label,value){
                        var field=document.createElement('div');
                        var labelNode=document.createElement('span');
                        var valueNode=document.createElement('strong');
                        labelNode.textContent=label;
                        valueNode.textContent=value;
                        field.appendChild(labelNode);
                        field.appendChild(valueNode);
                        container.appendChild(field);
                    }

                    function formatAmount(amount){
                        return 'UGX '+Number(amount).toLocaleString('en-UG');
                    }

                    function downloadReceipt(receipt,number,email,button){
                        button.disabled=true;
                        button.textContent='Preparing PDF…';
                        fetch(apiBase+'/orders/receipts/download/',{
                            method:'POST',
                            headers:{Accept:'application/pdf','Content-Type':'application/json'},
                            body:JSON.stringify({number:number,email:email,receipt_number:receipt.receipt_number})
                        }).then(function(response){
                            if(!response.ok){
                                return response.text().then(function(text){
                                    var data=null;
                                    try{data=text?JSON.parse(text):null;}catch(parseError){}
                                    throw new Error(data&&typeof data.detail==='string'?data.detail:'Could not download the receipt (HTTP '+response.status+').');
                                });
                            }
                            return response.blob();
                        }).then(function(file){
                            var url=URL.createObjectURL(file);
                            var link=document.createElement('a');
                            link.href=url;
                            link.download=receipt.receipt_number+'.pdf';
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                            window.setTimeout(function(){URL.revokeObjectURL(url);},60000);
                            showNotice('Receipt '+receipt.receipt_number+' downloaded.',false);
                        }).catch(function(error){
                            showNotice(error instanceof TypeError?'Could not connect to the receipt service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            button.disabled=false;
                            button.textContent='Download PDF';
                        });
                    }

                    function appendReceiptList(container,receipts,number,email){
                        if(!Array.isArray(receipts)||!receipts.length)return;
                        var section=document.createElement('section');
                        var title=document.createElement('h3');
                        section.className='cj-order-receipts';
                        title.textContent='Payment Receipts';
                        section.appendChild(title);
                        receipts.forEach(function(receipt){
                            var row=document.createElement('div');
                            var details=document.createElement('div');
                            var receiptNumber=document.createElement('strong');
                            var paymentDetails=document.createElement('small');
                            var button=document.createElement('button');
                            row.className='cj-order-receipt';
                            receiptNumber.textContent=receipt.receipt_number;
                            paymentDetails.textContent=formatAmount(receipt.amount_ugx)+' · '+new Date(receipt.verified_at).toLocaleString();
                            button.type='button';
                            button.textContent='Download PDF';
                            button.addEventListener('click',function(){
                                downloadReceipt(receipt,number,email,button);
                            });
                            details.appendChild(receiptNumber);
                            details.appendChild(paymentDetails);
                            row.appendChild(details);
                            row.appendChild(button);
                            section.appendChild(row);
                        });
                        container.appendChild(section);
                    }

                    function renderOrder(order,email){
                        var card=document.createElement('article');
                        card.className='cj-order-card';
                        var heading=document.createElement('div');
                        heading.className='cj-order-heading';
                        var titleGroup=document.createElement('div');
                        var title=document.createElement('h2');
                        var created=document.createElement('small');
                        var status=document.createElement('span');
                        title.textContent=order.number;
                        created.textContent='Placed '+new Date(order.created_at).toLocaleString();
                        status.className='cj-order-status'+(order.status==='cancelled'?' cancelled':'');
                        status.textContent=order.status_label;
                        titleGroup.appendChild(title);
                        titleGroup.appendChild(created);
                        heading.appendChild(titleGroup);
                        heading.appendChild(status);
                        card.appendChild(heading);

                        var meta=document.createElement('div');
                        meta.className='cj-order-meta';
                        addMeta(meta,'Order status',order.status_label);
                        addMeta(meta,'Payment',order.payment_status_label);
                        addMeta(meta,'Paid to date',formatAmount(order.amount_paid_ugx));
                        addMeta(meta,'Balance',formatAmount(order.balance_ugx));
                        addMeta(meta,'Service location',order.location);
                        addMeta(meta,'Order type',order.order_type==='dine_in'?'Dine-in':'Lodge / cottage');
                        addMeta(meta,'Payment method',order.payment_method==='cash'?'Cash at resort':'Card at counter');
                        card.appendChild(meta);

                        var itemsSection=document.createElement('div');
                        itemsSection.className='cj-order-items';
                        var itemsTitle=document.createElement('h3');
                        itemsTitle.textContent='Items';
                        itemsSection.appendChild(itemsTitle);
                        order.items.forEach(function(item){
                            var line=document.createElement('div');
                            var description=document.createElement('span');
                            var amount=document.createElement('strong');
                            line.className='cj-order-item';
                            description.textContent=item.quantity+' × '+item.product_name;
                            amount.textContent=formatAmount(item.line_total_ugx);
                            line.appendChild(description);
                            line.appendChild(amount);
                            itemsSection.appendChild(line);
                        });
                        card.appendChild(itemsSection);

                        var total=document.createElement('div');
                        var totalLabel=document.createElement('span');
                        var totalAmount=document.createElement('strong');
                        total.className='cj-order-total';
                        totalLabel.textContent='Total';
                        totalAmount.textContent=formatAmount(order.total_ugx);
                        total.appendChild(totalLabel);
                        total.appendChild(totalAmount);
                        card.appendChild(total);

                        var updateNote=document.createElement('p');
                        updateNote.className='cj-order-update-note';
                        updateNote.textContent='This order list covers the two days after each order was placed.';
                        card.appendChild(updateNote);
                        appendReceiptList(card,order.receipts,order.number,email);
                        result.appendChild(card);
                    }

                    function readResponse(response){
                        return response.text().then(function(text){
                            var data=null;
                            try{data=text?JSON.parse(text):null;}catch(parseError){}
                            if(!response.ok){
                                throw new Error(data&&typeof data.detail==='string'?data.detail:'The order service could not complete your request (HTTP '+response.status+').');
                            }
                            return data||{};
                        });
                    }

                    function requestCode(event){
                        event.preventDefault();
                        var email=emailInput.value.trim();
                        if(!email){
                            showNotice('Enter the email address used when placing your orders.',true);
                            return;
                        }
                        if(isFetching)return;
                        isFetching=true;
                        submitButton.disabled=true;
                        showNotice('Requesting a verification code…',false);
                        fetch(apiBase+'/orders/history/request-code/',{
                            method:'POST',
                            headers:{Accept:'application/json','Content-Type':'application/json'},
                            body:JSON.stringify({email:email})
                        }).then(readResponse).then(function(){
                            form.hidden=true;
                            codeForm.hidden=false;
                            resetButton.hidden=false;
                            codeCopy.textContent='If this email has recent orders, a code has been sent to '+email+'. The code expires in 10 minutes.';
                            codeInput.focus();
                            showNotice('Check your inbox for the verification code. If no recent order matches, no email will arrive.',false);
                        }).catch(function(error){
                            showNotice(error instanceof TypeError?'Could not connect to the resort order service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            submitButton.disabled=false;
                            isFetching=false;
                        });
                    }

                    function verifyCode(event){
                        event.preventDefault();
                        var email=emailInput.value.trim();
                        var code=codeInput.value.trim();
                        if(!/^\d{6}$/.test(code)){
                            showNotice('Enter the 6-digit code from your email.',true);
                            return;
                        }
                        if(isFetching)return;
                        isFetching=true;
                        verifyButton.disabled=true;
                        showNotice('Verifying your code…',false);
                        fetch(apiBase+'/orders/history/verify-code/',{
                            method:'POST',
                            headers:{Accept:'application/json','Content-Type':'application/json'},
                            body:JSON.stringify({email:email,code:code})
                        }).then(readResponse).then(function(data){
                            if(!Array.isArray(data.orders))throw new Error('The order service returned an invalid response.');
                            result.replaceChildren();
                            data.orders.forEach(function(order){renderOrder(order,email);});
                            showNotice(data.orders.length?'Showing '+data.orders.length+' recent order'+(data.orders.length===1?'':'s')+'.':'No orders were found for this email in the last two days.',false);
                            codeForm.hidden=true;
                        }).catch(function(error){
                            showNotice(error instanceof TypeError?'Could not connect to the resort order service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            verifyButton.disabled=false;
                            isFetching=false;
                        });
                    }

                    function resetLookup(){
                        form.hidden=false;
                        codeForm.hidden=true;
                        resetButton.hidden=true;
                        codeInput.value='';
                        result.replaceChildren();
                        showNotice('Enter the email address used when placing your orders.',false);
                        emailInput.focus();
                    }

                    function lookupOlderReceipt(event){
                        event.preventDefault();
                        var number=olderOrderNumber.value.trim();
                        var email=olderOrderEmail.value.trim();
                        if(isFetching)return;
                        isFetching=true;
                        olderReceiptSubmit.disabled=true;
                        showNotice('Looking up your receipt…',false);
                        fetch(apiBase+'/orders/receipts/',{
                            method:'POST',
                            headers:{Accept:'application/json','Content-Type':'application/json'},
                            body:JSON.stringify({number:number,email:email})
                        }).then(readResponse).then(function(data){
                            if(!Array.isArray(data.receipts))throw new Error('The receipt service returned an invalid response.');
                            olderReceiptResult.replaceChildren();
                            appendReceiptList(olderReceiptResult,data.receipts,number,email);
                            showNotice(data.receipts.length?'Payment receipts found for '+number+'.':'No payment receipts were found for that order.',false);
                        }).catch(function(error){
                            showNotice(error instanceof TypeError?'Could not connect to the receipt service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            olderReceiptSubmit.disabled=false;
                            isFetching=false;
                        });
                    }

                    form.addEventListener('submit',requestCode);
                    codeForm.addEventListener('submit',verifyCode);
                    resetButton.addEventListener('click',resetLookup);
                    olderReceiptForm.addEventListener('submit',lookupOlderReceipt);
                })();
            </script>
        </div>
    </t>
</t>
