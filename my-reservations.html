<t t-name="website.cj_my_reservations">
    <t t-call="website.layout">
        <div id="wrap" class="oe_structure oe_empty">
            <style>
                .cj-reservations-page{min-height:100vh;background:#f4f7f6;color:#242b27;font-family:Arial,Helvetica,sans-serif}
                .cj-reservations-container{width:min(900px,calc(100% - 32px));margin:46px auto 80px}
                .cj-reservations-heading{margin-bottom:24px}
                .cj-reservations-heading .eyebrow{color:#008B92;font-size:12px;font-weight:800;letter-spacing:1.6px}
                .cj-reservations-heading h1{margin:8px 0;font-size:38px;letter-spacing:-1px}
                .cj-reservations-heading p{max-width:620px;margin:0;color:#6f7a74;line-height:1.6}
                .cj-reservations-lookup,.cj-reservation-result{padding:24px;background:#fff;border:1px solid #e3e9e5;border-radius:10px;box-shadow:0 12px 32px rgba(21,40,30,.06)}
                .cj-reservations-lookup{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:14px}
                .cj-reservations-field{display:grid;gap:7px}
                .cj-reservations-field label{color:#47564e;font-size:13px;font-weight:700}
                .cj-reservations-field input{width:100%;height:46px;padding:0 12px;border:1px solid #d6dfd9;border-radius:6px;color:#27342d;background:#fff;font-size:15px}
                .cj-reservations-field input:focus{outline:2px solid rgba(0,139,146,.18);border-color:#008B92}
                .cj-reservations-submit{height:46px;padding:0 20px;border:0;border-radius:6px;color:#fff;background:#008B92;font-size:14px;font-weight:800;cursor:pointer}
                .cj-reservations-submit:disabled{opacity:.6;cursor:wait}
                .cj-reservation-notice{min-height:24px;margin:16px 0;color:#557064;font-size:13px}
                .cj-reservation-notice.error{color:#a63d36}
                .cj-reservation-result:empty{display:none}
                .cj-reservation-result{margin-top:8px}
                .cj-reservation-result-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid #edf1ee}
                .cj-reservation-result-heading h2{margin:0;color:#2e4539;font-size:23px}
                .cj-reservation-result-heading span{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:20px;color:#315b48;background:#eaf4ed;font-size:12px;font-weight:800}
                .cj-reservation-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}
                .cj-reservation-meta div{display:grid;gap:5px}
                .cj-reservation-meta span{color:#89968f;font-size:11px}
                .cj-reservation-meta strong{color:#41534a;font-size:13px}
                .cj-reservation-receipts{margin-top:24px;padding-top:18px;border-top:1px solid #edf1ee}
                .cj-reservation-receipts h3{margin:0 0 10px;color:#41534a;font-size:15px}
                .cj-reservation-receipt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eff2f0;color:#5e6d65;font-size:12px}
                .cj-reservation-receipt strong{display:block;color:#34483c}
                .cj-reservation-receipt small{display:block;margin-top:4px;color:#89968f}
                .cj-reservation-receipt button{min-height:36px;padding:0 12px;border:0;border-radius:6px;color:#fff;background:#008B92;font-size:12px;font-weight:800;cursor:pointer}
                .cj-reservation-update-note{margin:18px 0 0;color:#6f7a74;font-size:12px;line-height:1.5}
                @media(max-width:680px){.cj-reservations-container{width:calc(100% - 24px);margin:28px auto 56px}.cj-reservations-heading h1{font-size:32px}.cj-reservations-lookup{grid-template-columns:1fr}.cj-reservations-submit{width:100%}.cj-reservation-meta{grid-template-columns:1fr 1fr}}
                @media(max-width:420px){.cj-reservation-result-heading{align-items:flex-start;flex-direction:column}.cj-reservation-meta{grid-template-columns:1fr}.cj-reservation-receipt{align-items:flex-start;flex-direction:column}}
            </style>
            <main class="cj-reservations-page">
                <t t-call="website.cj_header"/>
                <div class="cj-reservations-container">
                    <header class="cj-reservations-heading">
                        <div class="eyebrow">YOUR RESORT STAY</div>
                        <h1>My Reservations</h1>
                        <p>Enter your reservation reference and the email used when you booked to view your stay and download verified payment receipts.</p>
                    </header>
                    <form id="cjReservationLookup" class="cj-reservations-lookup">
                        <div class="cj-reservations-field">
                            <label for="cjReservationReference">Reservation reference</label>
                            <input id="cjReservationReference" name="reference" required="required" maxlength="20" autocomplete="off" placeholder="e.g. LR-1234ABCD"/>
                        </div>
                        <div class="cj-reservations-field">
                            <label for="cjReservationEmail">Email address</label>
                            <input id="cjReservationEmail" name="email" type="email" required="required" maxlength="254" autocomplete="email" placeholder="you@example.com"/>
                        </div>
                        <button class="cj-reservations-submit" id="cjReservationLookupSubmit" type="submit">Find reservation</button>
                    </form>
                    <div class="cj-reservation-notice" id="cjReservationNotice" role="status" aria-live="polite"></div>
                    <section class="cj-reservation-result" id="cjReservationResult" aria-label="Reservation details"></section>
                </div>
            </main>
            <script>
                (function(){
                    var apiBase=(window.CJ_API_BASE_URL||'https://api.kalitusi.com/api/v1').replace(/\/+$/,'');
                    var form=document.getElementById('cjReservationLookup');
                    var referenceInput=document.getElementById('cjReservationReference');
                    var emailInput=document.getElementById('cjReservationEmail');
                    var submitButton=document.getElementById('cjReservationLookupSubmit');
                    var notice=document.getElementById('cjReservationNotice');
                    var result=document.getElementById('cjReservationResult');

                    function showNotice(message,isError){
                        notice.textContent=message;
                        notice.className='cj-reservation-notice'+(isError?' error':'');
                    }

                    function formatAmount(amount){
                        return 'UGX '+Number(amount).toLocaleString('en-UG');
                    }

                    function addMeta(container,label,value){
                        var field=document.createElement('div');
                        var labelNode=document.createElement('span');
                        var valueNode=document.createElement('strong');
                        labelNode.textContent=label;
                        valueNode.textContent=value;
                        field.appendChild(labelNode);
                        field.appendChild(valueNode);
                        container.appendChild(field);
                    }

                    function downloadReceipt(receipt,reservationReference,email,button){
                        button.disabled=true;
                        button.textContent='Preparing PDF…';
                        fetch(apiBase+'/reservations/receipts/download/',{
                            method:'POST',
                            headers:{Accept:'application/pdf','Content-Type':'application/json'},
                            body:JSON.stringify({reference:reservationReference,email:email,receipt_number:receipt.receipt_number})
                        }).then(function(response){
                            if(!response.ok){
                                return response.text().then(function(text){
                                    var data=null;
                                    try{data=text?JSON.parse(text):null;}catch(parseError){}
                                    throw new Error(data&&typeof data.detail==='string'?data.detail:'Could not download the receipt (HTTP '+response.status+').');
                                });
                            }
                            return response.blob();
                        }).then(function(file){
                            var url=URL.createObjectURL(file);
                            var link=document.createElement('a');
                            link.href=url;
                            link.download=receipt.receipt_number+'.pdf';
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                            window.setTimeout(function(){URL.revokeObjectURL(url);},60000);
                            showNotice('Receipt '+receipt.receipt_number+' downloaded.',false);
                        }).catch(function(error){
                            showNotice(error instanceof TypeError?'Could not connect to the receipt service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            button.disabled=false;
                            button.textContent='Download PDF';
                        });
                    }

                    function renderReservation(reservation,email){
                        result.replaceChildren();
                        var heading=document.createElement('div');
                        var title=document.createElement('h2');
                        var status=document.createElement('span');
                        heading.className='cj-reservation-result-heading';
                        title.textContent=reservation.reference;
                        status.textContent=reservation.status_label;
                        heading.appendChild(title);
                        heading.appendChild(status);
                        result.appendChild(heading);

                        var meta=document.createElement('div');
                        meta.className='cj-reservation-meta';
                        addMeta(meta,'Accommodation',reservation.lodge_name);
                        addMeta(meta,'Check-in',new Date(reservation.check_in+'T12:00:00').toLocaleDateString());
                        addMeta(meta,'Check-out',new Date(reservation.check_out+'T12:00:00').toLocaleDateString());
                        addMeta(meta,'Adults',String(reservation.adults));
                        addMeta(meta,'Children',String(reservation.children));
                        addMeta(meta,'Payment status',reservation.payment_status==='paid'?'Paid in full':reservation.payment_status==='partial'?'Partially paid':'Unpaid');
                        addMeta(meta,'Total due',formatAmount(reservation.total_due_ugx));
                        addMeta(meta,'Paid to date',formatAmount(reservation.amount_paid_ugx));
                        addMeta(meta,'Outstanding balance',formatAmount(reservation.balance_ugx));
                        result.appendChild(meta);

                        if(Array.isArray(reservation.receipts)&&reservation.receipts.length){
                            var section=document.createElement('section');
                            var receiptsTitle=document.createElement('h3');
                            section.className='cj-reservation-receipts';
                            receiptsTitle.textContent='Payment Receipts';
                            section.appendChild(receiptsTitle);
                            reservation.receipts.forEach(function(receipt){
                                var row=document.createElement('div');
                                var details=document.createElement('div');
                                var receiptNumber=document.createElement('strong');
                                var paymentDetails=document.createElement('small');
                                var button=document.createElement('button');
                                row.className='cj-reservation-receipt';
                                receiptNumber.textContent=receipt.receipt_number;
                                paymentDetails.textContent=formatAmount(receipt.amount_ugx)+' · '+new Date(receipt.verified_at).toLocaleString();
                                button.type='button';
                                button.textContent='Download PDF';
                                button.addEventListener('click',function(){
                                    downloadReceipt(receipt,reservation.reference,email,button);
                                });
                                details.appendChild(receiptNumber);
                                details.appendChild(paymentDetails);
                                row.appendChild(details);
                                row.appendChild(button);
                                section.appendChild(row);
                            });
                            result.appendChild(section);
                        }else{
                            var noReceipts=document.createElement('p');
                            noReceipts.className='cj-reservation-update-note';
                            noReceipts.textContent='No verified payment receipts are available yet. Receipts will appear here after resort staff confirms a payment.';
                            result.appendChild(noReceipts);
                        }
                    }

                    form.addEventListener('submit',function(event){
                        event.preventDefault();
                        var reference=referenceInput.value.trim();
                        var email=emailInput.value.trim();
                        if(!reference||!email){
                            showNotice('Enter both your reservation reference and email address.',true);
                            return;
                        }
                        submitButton.disabled=true;
                        showNotice('Looking up your reservation…',false);
                        fetch(apiBase+'/reservations/track/',{
                            method:'POST',
                            headers:{Accept:'application/json','Content-Type':'application/json'},
                            body:JSON.stringify({reference:reference,email:email})
                        }).then(function(response){
                            return response.text().then(function(text){
                                var data=null;
                                try{data=text?JSON.parse(text):null;}catch(parseError){}
                                if(!response.ok){
                                    if(response.status===404)throw new Error('No matching reservation found. Check the reference and email address.');
                                    if(response.status===429)throw new Error('Too many lookup attempts. Please wait before trying again.');
                                    throw new Error(data&&typeof data.detail==='string'?data.detail:'Could not look up the reservation (HTTP '+response.status+').');
                                }
                                if(!data||!Array.isArray(data.receipts))throw new Error('The reservation service returned an invalid response.');
                                return data;
                            });
                        }).then(function(reservation){
                            renderReservation(reservation,email);
                            showNotice('Showing reservation '+reservation.reference+'.',false);
                        }).catch(function(error){
                            result.replaceChildren();
                            showNotice(error instanceof TypeError?'Could not connect to the resort reservation service. Check your connection and try again.':error.message,true);
                        }).finally(function(){
                            submitButton.disabled=false;
                        });
                    });
                })();
            </script>
        </div>
    </t>
</t>
