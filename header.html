<t t-name="website.cj_header">
    <style>
        .cj-nav{height:78px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;position:relative;z-index:50}
        .cj-nav-inner{width:min(1180px,calc(100% - 32px));margin:auto;display:flex;align-items:center;justify-content:space-between}
        .cj-logo{color:#008B92;font-size:20px;font-weight:900;text-decoration:none;letter-spacing:-1px;text-transform:uppercase}
        .cj-nav-links,.cj-nav-actions{display:flex;align-items:center;gap:24px}
        .cj-nav-links a,.cj-nav-actions a{color:#222;text-decoration:none;font-weight:700}
        .cj-my-orders-link,.cj-my-reservations-link{white-space:nowrap}
        .cj-chat-launcher{position:fixed;right:24px;bottom:24px;z-index:2000;width:58px;height:58px;border:0;border-radius:50%;color:#fff;background:#008B92;box-shadow:0 12px 30px rgba(8,76,72,.25);font-size:25px;cursor:pointer}
        .cj-chat-panel{position:fixed;right:24px;bottom:94px;z-index:2000;display:flex;width:min(380px,calc(100vw - 28px));height:min(560px,calc(100vh - 130px));flex-direction:column;overflow:hidden;border:1px solid #dfe9e4;border-radius:16px;background:#fff;box-shadow:0 22px 65px rgba(12,46,43,.22);color:#203b38;font-family:Arial,Helvetica,sans-serif}
        .cj-chat-panel[hidden]{display:none}
        .cj-chat-header{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;color:#fff;background:#087d79}
        .cj-chat-heading{display:grid;gap:4px}.cj-chat-heading strong{font-size:16px}.cj-chat-heading small{color:#d7eeea;font-size:11px}
        .cj-chat-close{width:34px;height:34px;border:0;border-radius:50%;color:#fff;background:rgba(255,255,255,.15);font-size:22px;cursor:pointer}
        .cj-chat-content{display:flex;min-height:0;flex:1;flex-direction:column;padding:15px}
        .cj-chat-form{display:grid;gap:10px;margin:auto 0}
        .cj-chat-form[hidden]{display:none}
        .cj-chat-field{display:grid;gap:5px;color:#53645c;font-size:12px;font-weight:700}
        .cj-chat-field input,.cj-chat-field textarea{width:100%;min-height:42px;padding:10px;border:1px solid #dce5e0;border-radius:8px;color:#243b34;font:inherit}
        .cj-chat-submit{min-height:42px;padding:0 14px;border:0;border-radius:8px;color:#fff;background:#008B92;font-size:12px;font-weight:800;cursor:pointer}
        .cj-chat-submit:disabled{opacity:.6;cursor:wait}
        .cj-chat-error{min-height:18px;margin:9px 0;color:#a63d36;font-size:12px}
        .cj-chat-thread{display:flex;min-height:0;flex:1;flex-direction:column}
        .cj-chat-thread[hidden]{display:none}
        .cj-chat-messages{display:flex;min-height:0;flex:1;flex-direction:column;gap:9px;overflow:auto;padding:2px 2px 12px}
        .cj-chat-bubble{max-width:88%;padding:10px 12px;border-radius:12px;background:#f0f5f2;color:#354b41;font-size:13px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
        .cj-chat-bubble-customer{align-self:flex-end;background:#e1f2ef}
        .cj-chat-time{display:block;margin-top:5px;color:#87968e;font-size:10px}
        .cj-chat-composer{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;padding-top:10px;border-top:1px solid #edf1ee}
        .cj-chat-composer textarea{min-height:43px;max-height:100px;resize:vertical}
        .cj-chat-composer .cj-chat-submit{min-height:43px}
        .cj-chat-identity{padding:0;border:0;color:#007a80;background:transparent;font-size:11px;text-align:left;text-decoration:underline;cursor:pointer}
        @media(max-width:620px){
            .cj-nav{height:68px}
            .cj-logo{max-width:180px;font-size:12px;line-height:1.15}
            .cj-nav-links{gap:9px}
            .cj-nav-links>a:not(.cj-my-orders-link):not(.cj-my-reservations-link){display:none}
            .cj-my-orders-link,.cj-my-reservations-link{font-size:11px}
            .cj-nav-actions>a:first-child{display:none}
            .cj-chat-launcher{right:14px;bottom:14px;width:54px;height:54px}
            .cj-chat-panel{right:10px;bottom:78px;height:min(570px,calc(100vh - 100px))}
        }
    </style>
    <nav class="cj-nav">
        <div class="cj-nav-inner">
            <a class="cj-logo" href="/menu">Kalitusi Resort Nature Hotel</a>
            <div class="cj-nav-links">
                <a href="/menu">Menu</a>
                <a href="/menu#popular">Popular</a>
                <a class="cj-my-orders-link" href="/my-orders">My Orders</a>
                <a class="cj-my-reservations-link" href="/my-reservations">My Reservations</a>
            </div>
        </div>
    </nav>
    <button class="cj-chat-launcher" id="cjChatLauncher" type="button" aria-label="Chat with Kalitusi" aria-expanded="false" aria-controls="cjChatPanel">✉</button>
    <section class="cj-chat-panel" id="cjChatPanel" role="dialog" aria-modal="false" aria-labelledby="cjChatTitle" hidden="hidden">
        <header class="cj-chat-header">
            <div class="cj-chat-heading"><strong id="cjChatTitle">Chat with Kalitusi</strong><small>We’re here to help</small></div>
            <button class="cj-chat-close" id="cjChatClose" type="button" aria-label="Close chat">×</button>
        </header>
        <div class="cj-chat-content">
            <form class="cj-chat-form" id="cjChatIdentityForm">
                <p style="margin:0;color:#718079;font-size:13px;line-height:1.5">Verify your email to start a private conversation with our team.</p>
                <label class="cj-chat-field">Your name<input id="cjChatName" name="name" maxlength="120" autocomplete="name" required="required"/></label>
                <label class="cj-chat-field">Email address<input id="cjChatEmail" name="email" type="email" maxlength="254" autocomplete="email" required="required"/></label>
                <button class="cj-chat-submit" id="cjChatRequestCode" type="submit">Email verification code</button>
            </form>
            <form class="cj-chat-form" id="cjChatCodeForm" hidden="hidden">
                <p style="margin:0;color:#718079;font-size:13px;line-height:1.5">Enter the 6-digit code sent to your email address.</p>
                <label class="cj-chat-field">Verification code<input id="cjChatCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required="required"/></label>
                <button class="cj-chat-submit" id="cjChatVerifyCode" type="submit">Verify email</button>
                <button class="cj-chat-identity" id="cjChatChangeEmail" type="button">Use a different email</button>
            </form>
            <p class="cj-chat-error" id="cjChatError" role="status" aria-live="polite"></p>
            <div class="cj-chat-thread" id="cjChatThread" hidden="hidden">
                <div class="cj-chat-messages" id="cjChatMessages" aria-live="polite"></div>
                <form class="cj-chat-composer" id="cjChatMessageForm">
                    <label class="cj-chat-field" style="min-width:0">Message<textarea id="cjChatMessage" maxlength="2000" rows="2" required="required" placeholder="Type your message…"></textarea></label>
                    <button class="cj-chat-submit" id="cjChatSend" type="submit">Send</button>
                </form>
                <button class="cj-chat-identity" id="cjChatSignOut" type="button" style="margin-top:9px">End this chat session</button>
            </div>
        </div>
    </section>
    <script>
        (function(){
            var apiBase=(window.CJ_API_BASE_URL||'https://api.kalitusi.com/api/v1').replace(/\/+$/,'');
            var launcher=document.getElementById('cjChatLauncher');
            var panel=document.getElementById('cjChatPanel');
            var closeButton=document.getElementById('cjChatClose');
            var identityForm=document.getElementById('cjChatIdentityForm');
            var codeForm=document.getElementById('cjChatCodeForm');
            var thread=document.getElementById('cjChatThread');
            var errorNode=document.getElementById('cjChatError');
            var messageList=document.getElementById('cjChatMessages');
            var messageForm=document.getElementById('cjChatMessageForm');
            var messageInput=document.getElementById('cjChatMessage');
            var busy=false;
            var polling=null;
            var storageKey='cjChatAccessToken';

            function showError(message){errorNode.textContent=message||'';}
            function readResponse(response){
                return response.text().then(function(text){
                    var data=null;
                    try{data=text?JSON.parse(text):null;}catch(parseError){}
                    if(!response.ok)throw new Error(data&&data.detail?data.detail:'Chat request failed (HTTP '+response.status+').');
                    return data||{};
                });
            }
            function chatFetch(path,options){
                var headers=new Headers(options&&options.headers||{});
                headers.set('Accept','application/json');
                headers.set('Content-Type','application/json');
                var accessToken=sessionStorage.getItem(storageKey);
                if(accessToken)headers.set('Authorization','Chat '+accessToken);
                return fetch(apiBase+path,Object.assign({},options||{},{headers:headers}));
            }
            function showIdentity(){
                identityForm.hidden=false;
                codeForm.hidden=true;
                thread.hidden=true;
                window.clearInterval(polling);
                polling=null;
            }
            function renderMessages(messages){
                var atBottom=messageList.scrollHeight-messageList.scrollTop-messageList.clientHeight<50;
                messageList.replaceChildren();
                if(!messages.length){
                    var welcome=document.createElement('p');
                    welcome.className='cj-chat-bubble';
                    welcome.textContent='Hello! Send us a message and our team will reply here.';
                    messageList.appendChild(welcome);
                }
                messages.forEach(function(message){
                    var bubble=document.createElement('div');
                    var body=document.createElement('span');
                    var time=document.createElement('small');
                    bubble.className='cj-chat-bubble'+(message.sender==='customer'?' cj-chat-bubble-customer':'');
                    body.textContent=message.body;
                    time.className='cj-chat-time';
                    time.textContent=(message.sender==='customer'?'You':'Kalitusi team')+' · '+new Date(message.created_at).toLocaleString();
                    bubble.appendChild(body);
                    bubble.appendChild(time);
                    messageList.appendChild(bubble);
                });
                if(atBottom)messageList.scrollTop=messageList.scrollHeight;
            }
            function loadMessages(){
                if(busy||panel.hidden||!sessionStorage.getItem(storageKey))return;
                chatFetch('/chats/messages/').then(readResponse).then(function(data){
                    if(!Array.isArray(data.messages))throw new Error('Invalid chat response.');
                    renderMessages(data.messages);
                    identityForm.hidden=true;
                    codeForm.hidden=true;
                    thread.hidden=false;
                    showError('');
                }).catch(function(error){
                    if(error instanceof TypeError){showError('Could not connect. Check your internet connection and retry.');return;}
                    if(error.message.indexOf('session')!==-1||error.message.indexOf('Verify your email')!==-1){
                        sessionStorage.removeItem(storageKey);
                        showIdentity();
                    }
                    showError(error.message);
                });
            }
            function openPanel(){
                panel.hidden=false;
                launcher.setAttribute('aria-expanded','true');
                showError('');
                if(sessionStorage.getItem(storageKey)){
                    loadMessages();
                    if(!polling)polling=window.setInterval(loadMessages,5000);
                }else{
                    showIdentity();
                }
            }
            launcher.addEventListener('click',function(){if(panel.hidden)openPanel();else{panel.hidden=true;launcher.setAttribute('aria-expanded','false');}});
            closeButton.addEventListener('click',function(){panel.hidden=true;launcher.setAttribute('aria-expanded','false');});
            identityForm.addEventListener('submit',function(event){
                event.preventDefault();
                if(busy)return;
                busy=true;
                var button=document.getElementById('cjChatRequestCode');
                button.disabled=true;
                showError('Sending your verification code…');
                chatFetch('/chats/request-code/',{method:'POST',body:JSON.stringify({name:document.getElementById('cjChatName').value.trim(),email:document.getElementById('cjChatEmail').value.trim()})})
                    .then(readResponse).then(function(data){
                        identityForm.hidden=true;
                        codeForm.hidden=false;
                        document.getElementById('cjChatCode').focus();
                        showError(data.detail||'Check your email for the code.');
                    }).catch(function(error){showError(error.message);})
                    .finally(function(){busy=false;button.disabled=false;});
            });
            codeForm.addEventListener('submit',function(event){
                event.preventDefault();
                if(busy)return;
                busy=true;
                var button=document.getElementById('cjChatVerifyCode');
                button.disabled=true;
                showError('Verifying your email…');
                chatFetch('/chats/verify-code/',{method:'POST',body:JSON.stringify({email:document.getElementById('cjChatEmail').value.trim(),code:document.getElementById('cjChatCode').value.trim()})})
                    .then(readResponse).then(function(data){
                        if(!data.token||!Array.isArray(data.messages))throw new Error('Invalid chat response.');
                        sessionStorage.setItem(storageKey,data.token);
                        renderMessages(data.messages);
                        identityForm.hidden=true;
                        codeForm.hidden=true;
                        thread.hidden=false;
                        showError('');
                        if(!polling)polling=window.setInterval(loadMessages,5000);
                    }).catch(function(error){showError(error.message);})
                    .finally(function(){busy=false;button.disabled=false;});
            });
            document.getElementById('cjChatChangeEmail').addEventListener('click',function(){
                codeForm.hidden=true;
                identityForm.hidden=false;
                document.getElementById('cjChatCode').value='';
                showError('');
            });
            messageForm.addEventListener('submit',function(event){
                event.preventDefault();
                var body=messageInput.value.trim();
                if(!body||busy)return;
                busy=true;
                var button=document.getElementById('cjChatSend');
                button.disabled=true;
                chatFetch('/chats/messages/',{method:'POST',body:JSON.stringify({body:body})})
                    .then(readResponse).then(function(){messageInput.value='';loadMessages();})
                    .catch(function(error){showError(error.message);})
                    .finally(function(){busy=false;button.disabled=false;});
            });
            document.getElementById('cjChatSignOut').addEventListener('click',function(){
                sessionStorage.removeItem(storageKey);
                messageList.replaceChildren();
                identityForm.reset();
                codeForm.reset();
                showIdentity();
                showError('Chat session ended.');
            });
            document.addEventListener('keydown',function(event){
                if(event.key==='Escape'&&!panel.hidden){panel.hidden=true;launcher.setAttribute('aria-expanded','false');}
            });
        })();
    </script>

</t>
